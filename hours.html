<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <title>ניהול שעות עבודה</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Heebo', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #4B5563 #1F2937;
        }

        *::-webkit-scrollbar {
            width: 6px;
        }

        *::-webkit-scrollbar-track {
            background: #1F2937;
        }

        *::-webkit-scrollbar-thumb {
            background-color: #4B5563;
            border-radius: 3px;
        }

        .entry-card {
            transition: all 0.3s ease;
        }

        .modal-backdrop {
            backdrop-filter: blur(8px);
        }

        @media (max-width: 768px) {
            .modal-backdrop > div {
                margin: 0;
                border-radius: 1.5rem 1.5rem 0 0;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                max-height: 92vh;
            }
        }

        button, a, input, textarea, select {
            min-height: 44px;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
        }

        .toast {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Keep native date/time pickers readable on dark background */
        input[type="date"], input[type="time"], input[type="month"] {
            color-scheme: dark;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Icons
        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />

        );

        const Minus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" />
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />

        );

        const Check = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">

        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />

        const Pencil = ({ className }) => (

                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />

        const Clock = ({ className }) => (

            </svg>
        );

        const MapPin = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const Star = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
        );

        const Bus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2h-2M8 16v2a1 1 0 01-1 1H6a1 1 0 01-1-1v-2m3 0h8m0 0v2a1 1 0 001 1h1a1 1 0 001-1v-2M4 10h16M8 13h.01M16 13h.01" />
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        const Settings = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const FileText = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        );

        const Download = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );

        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );

        const ArrowRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        );

        // ---------- Constants & helpers ----------

        const STORAGE_KEY = 'workHoursEntries';
        const SETTINGS_KEY = 'workHoursSettings';

        // Defaults follow the employment contract: 50 ₪ an hour plus travel,
        // 300 ₪ for a trip day, 550 ₪ for a Shabbat. Every value — and whether
        // a trip/Shabbat payment replaces the hourly pay or is added on top —
        // is editable in the settings screen.
        const DEFAULT_SETTINGS = {
            employeeName: '',
            hourlyRate: 50,
            tripAmount: 300,
            tripMode: 'add',
            tripHours: 8,
            shabbatAmount: 550,
            shabbatMode: 'replace',
            travelPerDay: 0
        };

        const pad = (n) => String(n).padStart(2, '0');

        const todayISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        };

        const monthKeyOf = (isoDate) => (isoDate || '').slice(0, 7);

        const currentMonthKey = () => todayISO().slice(0, 7);

        // Minutes between two "HH:MM" strings, wrapping past midnight for night shifts.
        const minutesBetween = (start, end) => {
            if (!start || !end) return 0;
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            if ([sh, sm, eh, em].some(isNaN)) return 0;
            let diff = (eh * 60 + em) - (sh * 60 + sm);
            if (diff <= 0) diff += 24 * 60;
            return diff;
        };

        const hoursBetween = (start, end) => minutesBetween(start, end) / 60;

        const segmentsHours = (segments) =>
            (segments || []).reduce((sum, s) => sum + hoursBetween(s.start, s.end), 0);

        // 7.5 -> "7:30", so hours read like a clock instead of a decimal.
        const formatHours = (hours) => {
            const total = Math.round((Number(hours) || 0) * 60);
            return `${Math.floor(total / 60)}:${pad(total % 60)}`;
        };

        const formatMoney = (amount) => {
            const rounded = Math.round((Number(amount) || 0) * 100) / 100;
            return '₪' + rounded.toLocaleString('he-IL');
        };

        const formatMonth = (key) => {
            if (!key) return '';
            const [y, m] = key.split('-').map(Number);
            return new Date(y, m - 1, 1).toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
        };

        const formatDate = (iso) => {
            if (!iso) return '';
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' });
        };

        const dayName = (iso) => {
            if (!iso) return '';
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('he-IL', { weekday: 'long' });
        };

        const isSaturday = (iso) => {
            if (!iso) return false;
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).getDay() === 6;
        };

        const shiftMonth = (key, delta) => {
            const [y, m] = key.split('-').map(Number);
            const d = new Date(y, m - 1 + delta, 1);
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        };

        // Contract §20: the month's pay arrives by the 9th of the next month.
        const payDueDate = (monthKey) => {
            const [y, m] = monthKey.split('-').map(Number);
            const due = new Date(y, m, 9);
            return due.toLocaleDateString('he-IL', { day: 'numeric', month: 'long' });
        };

        // Accepts both "7.5" and "7:30" so the hours field matches how people think.
        const parseHoursInput = (value) => {
            const text = String(value || '').trim().replace(',', '.');
            if (!text) return 0;
            if (text.includes(':')) {
                const [h, m] = text.split(':');
                return (Number(h) || 0) + (Number(m) || 0) / 60;
            }
            return Number(text) || 0;
        };

        // Entries used to hold a single start/end pair; they now hold a list of
        // shifts, so a day worked in two parts is one entry.
        const normalizeEntry = (entry) => {
            const segments = Array.isArray(entry.segments)
                ? entry.segments.filter(s => s && s.start && s.end)
                : (entry.start && entry.end ? [{ start: entry.start, end: entry.end }] : []);
            return {
                ...entry,
                id: String(entry.id),
                segments,
                hours: Number(entry.hours) || 0,
                travel: Number(entry.travel) || 0,
                isTrip: Boolean(entry.isTrip),
                isShabbat: Boolean(entry.isShabbat),
                paid: Boolean(entry.paid),
                note: entry.note || ''
            };
        };

        const loadLocal = () => {
            const result = { entries: [], settings: DEFAULT_SETTINGS };
            try {
                const savedEntries = localStorage.getItem(STORAGE_KEY);
                if (savedEntries) result.entries = JSON.parse(savedEntries).map(normalizeEntry);
                const savedSettings = localStorage.getItem(SETTINGS_KEY);
                if (savedSettings) result.settings = { ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) };
            } catch (e) {
                console.error('Error loading work hours:', e);
            }
            return result;
        };

        // One place that decides what a day is worth, so the entry card, the
        // live preview in the form and the monthly report can never disagree.
        const payBreakdown = (entry, settings) => {
            const hours = Number(entry.hours) || 0;
            const rate = Number(settings.hourlyRate) || 0;
            const lines = [];

            let hourlyReplaced = false;
            if (entry.isShabbat && settings.shabbatMode === 'replace') hourlyReplaced = true;
            if (entry.isTrip && settings.tripMode === 'replace') hourlyReplaced = true;

            if (!hourlyReplaced && hours > 0) {
                lines.push({
                    key: 'hours',
                    label: `${formatHours(hours)} שעות × ${formatMoney(rate)}`,
                    amount: hours * rate
                });
            }
            if (entry.isShabbat) {
                lines.push({ key: 'shabbat', label: 'שבת', amount: Number(settings.shabbatAmount) || 0 });
            }
            if (entry.isTrip) {
                lines.push({ key: 'trip', label: 'יום טיול', amount: Number(settings.tripAmount) || 0 });
            }
            const travel = Number(entry.travel) || 0;
            if (travel > 0) {
                lines.push({ key: 'travel', label: 'נסיעות', amount: travel });
            }

            return { lines, total: lines.reduce((sum, line) => sum + line.amount, 0) };
        };

        const entryPay = (entry, settings) => payBreakdown(entry, settings).total;

        const summarize = (entries, settings) => {
            return entries.reduce((acc, entry) => {
                const pay = entryPay(entry, settings);
                acc.hours += Number(entry.hours) || 0;
                acc.pay += pay;
                acc.days += 1;
                acc.travel += Number(entry.travel) || 0;
                if (entry.isTrip) {
                    acc.tripDays += 1;
                    acc.extras += Number(settings.tripAmount) || 0;
                }
                if (entry.isShabbat) {
                    acc.shabbatDays += 1;
                    acc.extras += Number(settings.shabbatAmount) || 0;
                }
                if (entry.paid) acc.paid += pay;
                else acc.unpaid += pay;
                return acc;
            }, { hours: 0, pay: 0, days: 0, tripDays: 0, shabbatDays: 0, extras: 0, travel: 0, paid: 0, unpaid: 0 });
        };

        const sortByDate = (entries) => entries.slice().sort((a, b) =>
            a.date.localeCompare(b.date) ||
            ((a.segments[0] && a.segments[0].start) || '').localeCompare((b.segments[0] && b.segments[0].start) || '')
        );

        // Handing over a file: published as an artifact the viewer confirms the
        // save; as a plain page an ordinary download link does the job.
        const saveFile = async (filename, blob) => {
            const use = window.claude && window.claude.use;
            if (typeof use === 'function') {
                const downloads = await Promise.resolve(use.call(window.claude, 'downloads')).catch(() => null);
                if (downloads) {
                    try {
                        await downloads.save({ filename, data: blob });
                        return true;
                    } catch (e) {
                        return false;
                    }
                }
            }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            // Safari and mobile browsers only honour the download attribute
            // when the link is actually in the document.
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            return true;
        };

        // Toast Notification Component
        function Toast({ message, show, onClose }) {
            useEffect(() => {
                if (show) {
                    const timer = setTimeout(onClose, 2400);
                    return () => clearTimeout(timer);
                }
            }, [show, onClose]);

            if (!show) return null;

            return (
                <div className="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 toast px-4">
                    <div className="bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2">
                        <Check className="w-5 h-5 flex-shrink-0" />
                        <span className="font-medium">{message}</span>
                    </div>
                </div>
            );
        }

        // ---------- Cross-device sync ----------
        // Published as a Claude artifact this page is given a shared document
        // store, so the same log opens on every device. Anywhere else — a plain
        // file, GitHub Pages — `claude.use` simply isn't there and the page runs
        // straight from localStorage.

        const writeEntry = (db, entry) => {
            if (!db) return;
            const { id, ...body } = entry;
            db.doc('entries/' + id).set(body).catch(() => {});
        };

        const writeSettings = (db, settings) => {
            if (!db) return;
            db.doc('config/rates').set(settings).catch(() => {});
        };

        function useSyncedLog(initial, setEntries, setSettings) {
            const dbRef = useRef(null);
            const [synced, setSynced] = useState(false);

            useEffect(() => {
                const use = window.claude && window.claude.use;
                if (typeof use !== 'function') return;

                let stopped = false;
                let seeded = false;
                const stops = [];

                Promise.resolve(use.call(window.claude, 'db')).then(db => {
                    if (!db || stopped) return;
                    dbRef.current = db;
                    setSynced(true);

                    const fail = () => { dbRef.current = null; setSynced(false); };

                    stops.push(db.collection('entries').onSnapshot(snap => {
                        if (!seeded) {
                            seeded = true;
                            // First open on a synced device: hand the local log to
                            // the store rather than let an empty store blank it.
                            if (snap.empty && initial.entries.length > 0) {
                                initial.entries.forEach(entry => writeEntry(db, entry));
                                writeSettings(db, initial.settings);
                                return;
                            }
                        }
                        setEntries(snap.docs.map(doc => normalizeEntry({ ...doc.data(), id: doc.id })));
                    }, fail));

                    stops.push(db.doc('config/rates').onSnapshot(snap => {
                        if (snap.exists) setSettings({ ...DEFAULT_SETTINGS, ...snap.data() });
                    }, fail));
                }).catch(() => {});

                return () => {
                    stopped = true;
                    stops.forEach(stop => stop());
                };
            }, []);

            return {
                synced,
                pushEntry: (entry) => writeEntry(dbRef.current, entry),
                dropEntry: (id) => {
                    const db = dbRef.current;
                    if (db) db.doc('entries/' + id).delete().catch(() => {});
                },
                pushSettings: (next) => writeSettings(dbRef.current, next)
            };
        }

        // Main App Component
        function WorkHoursApp() {
            const initial = useRef(loadLocal());
            const [entries, setEntries] = useState(initial.current.entries);
            const [settings, setSettings] = useState(initial.current.settings);
            const [month, setMonth] = useState(currentMonthKey());
            const [editingEntry, setEditingEntry] = useState(null);
            const [showEntryModal, setShowEntryModal] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showReport, setShowReport] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '' });

            const { synced, pushEntry, dropEntry, pushSettings } =
                useSyncedLog(initial.current, setEntries, setSettings);

            // localStorage always holds a copy, so the log survives on this
            // device whether or not the shared store is available.
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
            }, [entries]);

            useEffect(() => {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            }, [settings]);

            const showToast = (message) => setToast({ show: true, message });
            const hideToast = () => setToast({ show: false, message: '' });

            const monthEntries = useMemo(
                () => sortByDate(entries.filter(e => monthKeyOf(e.date) === month)).reverse(),
                [entries, month]
            );

            const monthTotals = useMemo(() => summarize(monthEntries, settings), [monthEntries, settings]);
            const allTotals = useMemo(() => summarize(entries, settings), [entries, settings]);

            const monthsWithData = useMemo(() => {
                const keys = Array.from(new Set(entries.map(e => monthKeyOf(e.date)).filter(Boolean)));
                if (!keys.includes(month)) keys.push(month);
                return keys.sort().reverse();
            }, [entries, month]);

            const saveEntry = (data) => {
                let saved;
                if (data.id) {
                    const existing = entries.find(e => e.id === data.id);
                    saved = normalizeEntry({ ...existing, ...data });
                    setEntries(entries.map(e => e.id === data.id ? saved : e));
                    showToast('הרישום עודכן ✓');
                } else {
                    saved = normalizeEntry({
                        ...data,
                        id: Date.now(),
                        paid: false,
                        createdAt: new Date().toISOString()
                    });
                    setEntries([...entries, saved]);
                    showToast('הרישום נוסף! 🎉');
                }
                pushEntry(saved);
                setShowEntryModal(false);
                setEditingEntry(null);
                setMonth(monthKeyOf(data.date));
            };

            const deleteEntry = (id) => {
                setEntries(entries.filter(e => e.id !== id));
                dropEntry(id);
                showToast('הרישום נמחק');
            };

            const togglePaid = (id) => {
                const updated = entries.map(e => e.id === id ? { ...e, paid: !e.paid } : e);
                setEntries(updated);
                const changed = updated.find(e => e.id === id);
                if (changed) pushEntry(changed);
            };

            const markMonthPaid = () => {
                const allPaid = monthEntries.length > 0 && monthEntries.every(e => e.paid);
                const ids = new Set(monthEntries.map(e => e.id));
                const updated = entries.map(e => ids.has(e.id) ? { ...e, paid: !allPaid } : e);
                setEntries(updated);
                updated.filter(e => ids.has(e.id)).forEach(pushEntry);
                showToast(allPaid ? 'החודש סומן כלא שולם' : 'החודש סומן כשולם ✓');
            };

            const openNewEntry = () => {
                setEditingEntry(null);
                setShowEntryModal(true);
            };

            const openEditEntry = (entry) => {
                setEditingEntry(entry);
                setShowEntryModal(true);
            };

            const allPaidThisMonth = monthEntries.length > 0 && monthEntries.every(e => e.paid);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-slate-900 to-gray-900 text-white p-4 md:p-8 pb-28 md:pb-8">
                    <div className="max-w-5xl mx-auto">
                        {/* Header */}
                        <div className="flex items-start justify-between gap-3 mb-6">
                            {/* nav:start */}
                            <a
                                href="index.html"
                                className="flex items-center gap-2 text-gray-400 hover:text-white active:text-white transition-colors text-sm md:text-base"
                            >
                                <ArrowRight className="w-5 h-5" />
                                <span className="hidden sm:inline">ליומנים</span>
                            </a>
                            {/* nav:end */}
                            <div className="text-center flex-1">
                                <h1 className="text-3xl md:text-5xl font-bold mb-1 bg-gradient-to-r from-emerald-400 via-teal-400 to-blue-400 bg-clip-text text-transparent">
                                    ניהול שעות עבודה
                                </h1>
                                <p className="text-gray-400 text-sm md:text-base">
                                    {formatMoney(settings.hourlyRate)} לשעה · טיול {formatMoney(settings.tripAmount)} · שבת {formatMoney(settings.shabbatAmount)}
                                </p>
                                {synced && (
                                    <p className="text-xs text-teal-400/80 mt-1">מסונכרן בין המכשירים שלך</p>
                                )}
                            </div>
                            <button
                                onClick={() => setShowSettings(true)}
                                className="p-2 text-gray-400 hover:text-white hover:bg-gray-800 active:bg-gray-700 rounded-xl transition-colors"
                                title="הגדרות תעריפים"
                            >
                                <Settings className="w-6 h-6" />
                            </button>
                        </div>

                        {/* Month selector */}
                        <div className="flex items-center justify-between gap-2 bg-gray-800/50 backdrop-blur-sm rounded-2xl p-2 md:p-3 border border-gray-700/50 mb-4 md:mb-6">
                            <button
                                onClick={() => setMonth(shiftMonth(month, 1))}
                                className="p-2 hover:bg-gray-700 active:bg-gray-600 rounded-xl transition-colors"
                                title="חודש הבא"
                            >
                                <ChevronLeft className="w-5 h-5" />
                            </button>
                            <div className="flex items-center gap-2 flex-1 justify-center min-w-0">
                                <Calendar className="w-5 h-5 text-teal-400 flex-shrink-0" />
                                <select
                                    id="month-select"
                                    value={month}
                                    onChange={(e) => setMonth(e.target.value)}
                                    className="bg-transparent text-base md:text-lg font-semibold text-center focus:outline-none cursor-pointer max-w-full"
                                >
                                    {monthsWithData.map(key => (
                                        <option key={key} value={key} className="bg-gray-800">{formatMonth(key)}</option>
                                    ))}
                                </select>
                            </div>
                            <button
                                onClick={() => setMonth(shiftMonth(month, -1))}
                                className="p-2 hover:bg-gray-700 active:bg-gray-600 rounded-xl transition-colors"
                                title="חודש קודם"
                            >
                                <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>

                        {/* Month summary */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-3">
                            <StatCard
                                icon={<Clock className="w-5 h-5" />}
                                label="שעות החודש"
                                value={formatHours(monthTotals.hours)}
                                sub={`${monthTotals.days} ימי עבודה`}
                                gradient="from-blue-500 to-cyan-600"
                            />
                            <StatCard
                                icon={<Wallet className="w-5 h-5" />}
                                label="סה״כ לתשלום"
                                value={formatMoney(monthTotals.pay)}
                                sub="ברוטו, לפני ניכויים"
                                gradient="from-emerald-500 to-teal-600"
                            />
                            <StatCard
                                icon={<Star className="w-5 h-5" />}
                                label="טיולים / שבתות"
                                value={`${monthTotals.tripDays} / ${monthTotals.shabbatDays}`}
                                sub={`${formatMoney(monthTotals.extras)} תוספות`}
                                gradient="from-orange-500 to-amber-600"
                            />
                            <StatCard
                                icon={<Check className="w-5 h-5" />}
                                label="טרם שולם"
                                value={formatMoney(monthTotals.unpaid)}
                                sub={`שולם ${formatMoney(monthTotals.paid)}`}
                                gradient="from-purple-500 to-pink-600"
                            />
                        </div>

                        {monthEntries.length > 0 && !allPaidThisMonth && (
                            <p className="text-xs text-gray-500 mb-4 md:mb-6 text-center">
                                לפי ההסכם, השכר עבור {formatMonth(month)} אמור להשתלם עד {payDueDate(month)}.
                            </p>
                        )}

                        {/* Actions */}
                        <div className="flex flex-wrap items-center gap-2 mb-4 md:mb-6">
                            <button
                                onClick={openNewEntry}
                                className="hidden md:flex items-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 px-6 py-3 rounded-2xl font-semibold shadow-2xl hover:shadow-teal-500/40 transition-all transform active:scale-95"
                            >
                                <Plus className="w-5 h-5" />
                                הוסף יום עבודה
                            </button>
                            <button
                                onClick={() => setShowReport(true)}
                                disabled={monthEntries.length === 0}
                                className="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 disabled:opacity-40 disabled:cursor-not-allowed px-4 py-3 rounded-2xl text-sm font-medium border border-gray-700 transition-colors"
                            >
                                <FileText className="w-4 h-4" />
                                דוח חודשי
                            </button>
                            <button
                                onClick={markMonthPaid}
                                disabled={monthEntries.length === 0}
                                className="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 disabled:opacity-40 disabled:cursor-not-allowed px-4 py-3 rounded-2xl text-sm font-medium border border-gray-700 transition-colors"
                            >
                                <Check className="w-4 h-4" />
                                {allPaidThisMonth ? 'בטל סימון תשלום' : 'סמן חודש כשולם'}
                            </button>
                        </div>

                        {/* Entries */}
                        {monthEntries.length === 0 ? (
                            <div className="text-center py-12 md:py-20 bg-gray-800/30 rounded-2xl border border-gray-700/50">
                                <Clock className="w-20 h-20 mx-auto mb-4 text-gray-600" />
                                <h2 className="text-xl md:text-2xl font-semibold text-gray-400 mb-2">אין רישומים ב{formatMonth(month)}</h2>
                                <p className="text-gray-500 text-sm md:text-base">הוסף יום עבודה — אפשר לרשום כמה משמרות באותו יום</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {monthEntries.map(entry => (
                                    <EntryCard
                                        key={entry.id}
                                        entry={entry}
                                        settings={settings}
                                        onEdit={() => openEditEntry(entry)}
                                        onDelete={() => deleteEntry(entry.id)}
                                        onTogglePaid={() => togglePaid(entry.id)}
                                    />
                                ))}
                            </div>
                        )}

                        {/* All time summary */}
                        {entries.length > 0 && (
                            <div className="mt-6 bg-gray-800/50 backdrop-blur-sm rounded-2xl p-4 md:p-5 border border-gray-700/50">
                                <h3 className="text-sm text-gray-400 mb-3">סיכום מצטבר (כל התקופה)</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                                    <div>
                                        <div className="text-xl md:text-2xl font-bold text-blue-400 tabular">{formatHours(allTotals.hours)}</div>
                                        <div className="text-xs text-gray-500">שעות</div>
                                    </div>
                                    <div>
                                        <div className="text-xl md:text-2xl font-bold text-emerald-400 tabular">{formatMoney(allTotals.pay)}</div>
                                        <div className="text-xs text-gray-500">סה״כ ברוטו</div>
                                    </div>
                                    <div>
                                        <div className="text-xl md:text-2xl font-bold text-orange-400 tabular">{allTotals.tripDays + allTotals.shabbatDays}</div>
                                        <div className="text-xs text-gray-500">טיולים ושבתות</div>
                                    </div>
                                    <div>
                                        <div className="text-xl md:text-2xl font-bold text-pink-400 tabular">{formatMoney(allTotals.unpaid)}</div>
                                        <div className="text-xs text-gray-500">טרם שולם</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Mobile add button */}
                        <div className="md:hidden fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-gray-900 via-gray-900/95 to-transparent backdrop-blur-sm z-40">
                            <button
                                onClick={openNewEntry}
                                className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 active:from-emerald-700 active:to-teal-700 px-6 py-4 rounded-2xl font-semibold text-lg shadow-2xl transform active:scale-95 transition-all"
                            >
                                <Plus className="w-6 h-6" />
                                הוסף יום עבודה
                            </button>
                        </div>

                        {showEntryModal && (
                            <EntryModal
                                entry={editingEntry}
                                settings={settings}
                                defaultMonth={month}
                                onClose={() => { setShowEntryModal(false); setEditingEntry(null); }}
                                onSave={saveEntry}
                            />
                        )}

                        {showSettings && (
                            <SettingsModal
                                settings={settings}
                                onClose={() => setShowSettings(false)}
                                onSave={(next) => {
                                    setSettings(next);
                                    pushSettings(next);
                                    setShowSettings(false);
                                    showToast('ההגדרות נשמרו ✓');
                                }}
                            />
                        )}

                        {showReport && (
                            <ReportModal
                                month={month}
                                entries={sortByDate(monthEntries)}
                                totals={monthTotals}
                                settings={settings}
                                onClose={() => setShowReport(false)}
                                onToast={showToast}
                            />
                        )}
                    </div>
                    <Toast message={toast.message} show={toast.show} onClose={hideToast} />
                </div>
            );
        }

        // Stat Card Component
        function StatCard({ icon, label, value, sub, gradient }) {
            return (
                <div className="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-4 border border-gray-700/50 shadow-lg">
                    <div className={`inline-flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-r ${gradient} mb-2`}>
                        {icon}
                    </div>
                    <div className="text-xs text-gray-400">{label}</div>
                    <div className="text-2xl md:text-3xl font-bold tabular">{value}</div>
                    <div className="text-[11px] text-gray-500 truncate">{sub}</div>
                </div>
            );
        }

        // Entry Card Component
        function EntryCard({ entry, settings, onEdit, onDelete, onTogglePaid }) {
            // The delete step asks for confirmation inside the card: a browser
            // confirm() dialog is blocked in some embedded views, which silently
            // swallowed the delete.
            const [confirming, setConfirming] = useState(false);
            const { lines, total } = payBreakdown(entry, settings);
            const highlight = entry.isShabbat ? 'border-indigo-500/40' : entry.isTrip ? 'border-orange-500/40' : 'border-gray-700/50';

            return (
                <div className={`entry-card bg-gray-800/50 backdrop-blur-sm rounded-2xl p-4 md:p-5 border shadow-lg ${highlight}`}>
                    <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-2 flex-wrap mb-2">
                                <span className="font-semibold text-base md:text-lg">{dayName(entry.date)}</span>
                                <span className="text-sm text-gray-400 tabular">{formatDate(entry.date)}</span>
                                {entry.isTrip && (
                                    <span className="flex items-center gap-1 text-xs bg-orange-500/20 text-orange-300 px-2 py-1 rounded-full">
                                        <MapPin className="w-3 h-3" />
                                        יום טיול
                                    </span>
                                )}
                                {entry.isShabbat && (
                                    <span className="flex items-center gap-1 text-xs bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-full">
                                        <Star className="w-3 h-3" />
                                        שבת
                                    </span>
                                )}
                                {entry.paid && (
                                    <span className="text-xs bg-green-500/20 text-green-300 px-2 py-1 rounded-full">שולם</span>
                                )}
                            </div>

                            <div className="flex items-center gap-2 text-sm text-gray-300 mb-1">
                                <Clock className="w-4 h-4 text-blue-400 flex-shrink-0" />
                                <span className="tabular">{formatHours(entry.hours)} שעות</span>
                                {entry.segments.length > 1 && (
                                    <span className="text-xs text-gray-500">({entry.segments.length} משמרות)</span>
                                )}
                            </div>

                            {entry.segments.length > 0 && (
                                <div className="flex flex-wrap gap-2 mb-1">
                                    {entry.segments.map((seg, i) => (
                                        <span key={i} className="text-xs bg-gray-700/50 text-gray-300 px-2 py-1 rounded-lg tabular" dir="ltr">
                                            {seg.start} - {seg.end}
                                        </span>
                                    ))}
                                </div>
                            )}

                            {entry.note && (
                                <p className="text-sm text-gray-400 mt-2 break-words">{entry.note}</p>
                            )}
                        </div>

                        <div className="text-left flex-shrink-0">
                            <div className="text-xl md:text-2xl font-bold text-emerald-400 tabular">{formatMoney(total)}</div>
                            {lines.length > 1 && (
                                <div className="text-[11px] text-gray-500 mt-1 space-y-0.5">
                                    {lines.map(line => (
                                        <div key={line.key} className="tabular">{formatMoney(line.amount)} {line.key === 'hours' ? 'שעות' : line.label}</div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {confirming ? (
                        <div className="flex items-center gap-2 mt-3 pt-3 border-t border-gray-700/50">
                            <span className="text-sm text-gray-300 flex-1">למחוק את הרישום?</span>
                            <button
                                onClick={() => setConfirming(false)}
                                className="px-3 py-2 rounded-lg text-xs font-medium bg-gray-700 hover:bg-gray-600 transition-colors"
                            >
                                ביטול
                            </button>
                            <button
                                onClick={() => { setConfirming(false); onDelete(); }}
                                className="px-3 py-2 rounded-lg text-xs font-semibold bg-red-600 hover:bg-red-700 active:bg-red-800 transition-colors"
                            >
                                מחק
                            </button>
                        </div>
                    ) : (
                        <div className="flex items-center gap-2 mt-3 pt-3 border-t border-gray-700/50">
                            <button
                                onClick={onTogglePaid}
                                className={`flex items-center gap-1 px-3 py-2 rounded-lg text-xs font-medium transition-colors ${entry.paid ? 'bg-green-600/20 text-green-300 hover:bg-green-600/30' : 'bg-gray-700/50 text-gray-300 hover:bg-gray-700'}`}
                            >
                                <Check className="w-3 h-3" />
                                {entry.paid ? 'שולם' : 'סמן כשולם'}
                            </button>
                            <div className="flex-1" />
                            <button
                                onClick={onEdit}
                                className="p-2 text-gray-400 hover:text-white hover:bg-gray-700 active:bg-gray-600 rounded-lg transition-colors"
                                title="עריכה"
                            >
                                <Pencil className="w-4 h-4" />
                            </button>
                            <button
                                onClick={() => setConfirming(true)}
                                className="p-2 text-gray-400 hover:text-white hover:bg-red-600 active:bg-red-700 rounded-lg transition-colors"
                                title="מחיקה"
                            >
                                <Trash2 className="w-4 h-4" />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const EMPTY_SEGMENT = { start: '09:00', end: '13:00' };

        // Add / Edit Entry Modal
        function EntryModal({ entry, settings, defaultMonth, onClose, onSave }) {
            const isEdit = Boolean(entry);
            const initialDate = entry ? entry.date
                : (defaultMonth === currentMonthKey() ? todayISO() : `${defaultMonth}-01`);

            const [date, setDate] = useState(initialDate);
            const [mode, setMode] = useState(entry && entry.segments.length === 0 ? 'manual' : 'shifts');
            const [segments, setSegments] = useState(
                entry && entry.segments.length > 0 ? entry.segments : [{ ...EMPTY_SEGMENT }]
            );
            const [manualHours, setManualHours] = useState(
                entry ? String(Math.round((entry.hours || 0) * 100) / 100) : ''
            );
            const [isTrip, setIsTrip] = useState(entry ? entry.isTrip : false);
            const [isShabbat, setIsShabbat] = useState(entry ? entry.isShabbat : isSaturday(initialDate));
            const [travel, setTravel] = useState(
                entry ? String(entry.travel || '') : (settings.travelPerDay ? String(settings.travelPerDay) : '')
            );
            const [note, setNote] = useState(entry ? entry.note : '');
            const [error, setError] = useState('');

            const hours = mode === 'shifts' ? segmentsHours(segments) : parseHoursInput(manualHours);
            const draft = { hours, isTrip, isShabbat, travel: Number(travel) || 0 };
            const { lines, total } = payBreakdown(draft, settings);

            const updateSegment = (index, field, value) => {
                setSegments(segments.map((seg, i) => i === index ? { ...seg, [field]: value } : seg));
                setError('');
            };

            const addSegment = () => {
                const last = segments[segments.length - 1];
                setSegments([...segments, last ? { start: last.end, end: last.end } : { ...EMPTY_SEGMENT }]);
            };

            const removeSegment = (index) => {
                setSegments(segments.length > 1 ? segments.filter((_, i) => i !== index) : segments);
            };

            const stepManual = (delta) => {
                const next = Math.max(0, Math.round((parseHoursInput(manualHours) + delta) * 100) / 100);
                setManualHours(next ? String(next) : '');
                setError('');
            };

            const useTripHours = () => {
                setMode('manual');
                setManualHours(String(settings.tripHours));
                setError('');
            };

            const handleSave = () => {
                if (!date) {
                    setError('יש לבחור תאריך');
                    return;
                }
                const cleanSegments = mode === 'shifts'
                    ? segments.filter(s => s.start && s.end && minutesBetween(s.start, s.end) > 0)
                    : [];
                if (mode === 'shifts' && cleanSegments.length === 0) {
                    setError('יש להזין לפחות משמרת אחת עם שעת התחלה וסיום');
                    return;
                }
                const flatPay = (isTrip && settings.tripMode === 'replace') || (isShabbat && settings.shabbatMode === 'replace');
                if (hours <= 0 && !flatPay) {
                    setError('יש להזין שעות עבודה');
                    return;
                }
                onSave({
                    id: entry ? entry.id : undefined,
                    date,
                    segments: cleanSegments,
                    hours: Math.round(hours * 100) / 100,
                    isTrip,
                    isShabbat,
                    travel: Number(travel) || 0,
                    note: note.trim()
                });
            };

            return (
                <div className="modal-backdrop fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-50 md:p-4">
                    <div className="bg-gray-800 rounded-t-3xl md:rounded-2xl p-5 md:p-6 max-w-lg w-full border border-gray-700 shadow-2xl overflow-y-auto">
                        <div className="flex items-center justify-between mb-5">
                            <h2 className="text-xl md:text-2xl font-bold">{isEdit ? 'עריכת יום עבודה' : 'הוספת יום עבודה'}</h2>
                            <button
                                onClick={onClose}
                                className="p-2 hover:bg-gray-700 active:bg-gray-600 rounded-lg transition-colors"
                            >
                                <X className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="space-y-4">
                            {/* Date */}
                            <div>
                                <label htmlFor="entry-date" className="block text-sm font-medium mb-2 text-gray-300">תאריך</label>
                                <input
                                    id="entry-date"
                                    type="date"
                                    value={date}
                                    onChange={(e) => {
                                        setDate(e.target.value);
                                        if (!entry) setIsShabbat(isSaturday(e.target.value));
                                        setError('');
                                    }}
                                    className="w-full bg-gray-700 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500"
                                />
                                {date && <p className="text-xs text-gray-500 mt-1">{dayName(date)}</p>}
                            </div>

                            {/* Mode toggle */}
                            <div className="grid grid-cols-2 gap-2 bg-gray-900/50 p-1 rounded-xl">
                                <button
                                    onClick={() => { setMode('shifts'); setError(''); }}
                                    className={`py-2 rounded-lg text-sm font-medium transition-colors ${mode === 'shifts' ? 'bg-teal-600 text-white' : 'text-gray-400 hover:text-white'}`}
                                >
                                    משמרות
                                </button>
                                <button
                                    onClick={() => { setMode('manual'); setError(''); }}
                                    className={`py-2 rounded-lg text-sm font-medium transition-colors ${mode === 'manual' ? 'bg-teal-600 text-white' : 'text-gray-400 hover:text-white'}`}
                                >
                                    מספר שעות
                                </button>
                            </div>

                            {mode === 'shifts' ? (
                                <div className="space-y-2">
                                    {segments.map((seg, index) => (
                                        <div key={index} className="bg-gray-700/40 rounded-xl p-3">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-xs text-gray-400">
                                                    משמרת {index + 1}
                                                    {minutesBetween(seg.start, seg.end) > 0 && (
                                                        <span className="text-teal-300 tabular"> · {formatHours(hoursBetween(seg.start, seg.end))} שעות</span>
                                                    )}
                                                </span>
                                                {segments.length > 1 && (
                                                    <button
                                                        onClick={() => removeSegment(index)}
                                                        className="p-1 text-gray-400 hover:text-red-400 transition-colors"
                                                        title="הסר משמרת"
                                                        style={{ minHeight: 'auto' }}
                                                    >
                                                        <X className="w-4 h-4" />
                                                    </button>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-[11px] text-gray-400 mb-1">התחלה</label>
                                                    <input
                                                        type="time"
                                                        step="900"
                                                        value={seg.start}
                                                        onChange={(e) => updateSegment(index, 'start', e.target.value)}
                                                        className="w-full bg-gray-700 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] text-gray-400 mb-1">סיום</label>
                                                    <input
                                                        type="time"
                                                        step="900"
                                                        value={seg.end}
                                                        onChange={(e) => updateSegment(index, 'end', e.target.value)}
                                                        className="w-full bg-gray-700 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-500"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <button
                                        onClick={addSegment}
                                        className="w-full flex items-center justify-center gap-2 bg-gray-700/40 hover:bg-gray-700 active:bg-gray-600 border border-dashed border-gray-600 rounded-xl py-3 text-sm font-medium transition-colors"
                                    >
                                        <Plus className="w-4 h-4" />
                                        הוסף משמרת נוספת באותו יום
                                    </button>
                                </div>
                            ) : (
                                <div>
                                    <label htmlFor="entry-hours" className="block text-sm font-medium mb-2 text-gray-300">שעות עבודה</label>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => stepManual(-0.5)}
                                            className="w-12 h-12 flex items-center justify-center bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl transition-colors flex-shrink-0"
                                            title="חצי שעה פחות"
                                        >
                                            <Minus className="w-4 h-4" />
                                        </button>
                                        <input
                                            id="entry-hours"
                                            type="text"
                                            inputMode="decimal"
                                            value={manualHours}
                                            onChange={(e) => { setManualHours(e.target.value); setError(''); }}
                                            placeholder="לדוגמה: 7.5 או 7:30"
                                            className="flex-1 min-w-0 bg-gray-700 rounded-xl px-4 py-3 text-base text-center tabular focus:outline-none focus:ring-2 focus:ring-teal-500"
                                        />
                                        <button
                                            onClick={() => stepManual(0.5)}
                                            className="w-12 h-12 flex items-center justify-center bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl transition-colors flex-shrink-0"
                                            title="חצי שעה יותר"
                                        >
                                            <Plus className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Trip day */}
                            <div className={`rounded-xl p-4 border transition-colors ${isTrip ? 'bg-orange-500/10 border-orange-500/40' : 'bg-gray-700/40 border-gray-700'}`}>
                                <button
                                    onClick={() => setIsTrip(!isTrip)}
                                    className="w-full flex items-center justify-between gap-3 text-right"
                                >
                                    <span className="flex items-center gap-2">
                                        <MapPin className={`w-5 h-5 ${isTrip ? 'text-orange-400' : 'text-gray-400'}`} />
                                        <span className="font-medium">יום טיול</span>
                                    </span>
                                    <span className={`w-12 h-7 rounded-full flex items-center px-1 transition-colors ${isTrip ? 'bg-orange-500 justify-start' : 'bg-gray-600 justify-end'}`}>
                                        <span className="w-5 h-5 bg-white rounded-full block" />
                                    </span>
                                </button>
                                {isTrip && (
                                    <div className="mt-3 text-xs text-orange-200/80 flex items-center justify-between gap-2 flex-wrap">
                                        <span>
                                            {formatMoney(settings.tripAmount)} {settings.tripMode === 'add' ? 'מעבר לתשלום לפי שעות' : 'במקום תשלום לפי שעות'}
                                        </span>
                                        <button onClick={useTripHours} className="underline hover:text-orange-100">
                                            קבע {settings.tripHours} שעות
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Shabbat */}
                            <div className={`rounded-xl p-4 border transition-colors ${isShabbat ? 'bg-indigo-500/10 border-indigo-500/40' : 'bg-gray-700/40 border-gray-700'}`}>
                                <button
                                    onClick={() => setIsShabbat(!isShabbat)}
                                    className="w-full flex items-center justify-between gap-3 text-right"
                                >
                                    <span className="flex items-center gap-2">
                                        <Star className={`w-5 h-5 ${isShabbat ? 'text-indigo-400' : 'text-gray-400'}`} />
                                        <span className="font-medium">שבת</span>
                                    </span>
                                    <span className={`w-12 h-7 rounded-full flex items-center px-1 transition-colors ${isShabbat ? 'bg-indigo-500 justify-start' : 'bg-gray-600 justify-end'}`}>
                                        <span className="w-5 h-5 bg-white rounded-full block" />
                                    </span>
                                </button>
                                {isShabbat && (
                                    <p className="mt-3 text-xs text-indigo-200/80">
                                        {formatMoney(settings.shabbatAmount)} {settings.shabbatMode === 'add' ? 'מעבר לתשלום לפי שעות' : 'במקום תשלום לפי שעות'}
                                    </p>
                                )}
                            </div>

                            {/* Travel */}
                            <div>
                                <label htmlFor="entry-travel" className="block text-sm font-medium mb-2 text-gray-300">נסיעות (₪, אופציונלי)</label>
                                <div className="relative">
                                    <Bus className="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2" />
                                    <input
                                        id="entry-travel"
                                        type="text"
                                        inputMode="decimal"
                                        value={travel}
                                        onChange={(e) => setTravel(e.target.value)}
                                        placeholder="0"
                                        className="w-full bg-gray-700 rounded-xl pr-11 pl-4 py-3 text-base tabular focus:outline-none focus:ring-2 focus:ring-teal-500"
                                    />
                                </div>
                            </div>

                            {/* Note */}
                            <div>
                                <label htmlFor="entry-note" className="block text-sm font-medium mb-2 text-gray-300">הערה (אופציונלי)</label>
                                <textarea
                                    id="entry-note"
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    placeholder="מה עשית היום?"
                                    rows={2}
                                    className="w-full bg-gray-700 rounded-xl px-4 py-3 text-base resize-none focus:outline-none focus:ring-2 focus:ring-teal-500 placeholder-gray-500"
                                />
                            </div>

                            {/* Live calculation */}
                            <div className="bg-gray-900/60 rounded-xl p-4 border border-gray-700">
                                {lines.length === 0 ? (
                                    <p className="text-sm text-gray-500 text-center">הזן שעות כדי לראות את התשלום</p>
                                ) : lines.map(line => (
                                    <div key={line.key} className="flex items-center justify-between text-sm text-gray-400 mb-1">
                                        <span>{line.label}</span>
                                        <span className="tabular">{formatMoney(line.amount)}</span>
                                    </div>
                                ))}
                                <div className="flex items-center justify-between font-bold text-lg pt-2 border-t border-gray-700">
                                    <span>סה״כ</span>
                                    <span className="text-emerald-400 tabular">{formatMoney(total)}</span>
                                </div>
                            </div>

                            {error && (
                                <p className="text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3">
                                    {error}
                                </p>
                            )}

                            <div className="flex gap-3 pt-1">
                                <button
                                    onClick={onClose}
                                    className="flex-1 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 py-3 rounded-xl font-medium transition-colors"
                                >
                                    ביטול
                                </button>
                                <button
                                    onClick={handleSave}
                                    className="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 py-3 rounded-xl font-semibold transition-all transform active:scale-95"
                                >
                                    {isEdit ? 'שמור שינויים' : 'הוסף'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Settings Modal
        function SettingsModal({ settings, onClose, onSave }) {
            const [form, setForm] = useState({
                employeeName: settings.employeeName || '',
                hourlyRate: String(settings.hourlyRate),
                tripAmount: String(settings.tripAmount),
                tripMode: settings.tripMode,
                tripHours: String(settings.tripHours),
                shabbatAmount: String(settings.shabbatAmount),
                shabbatMode: settings.shabbatMode,
                travelPerDay: String(settings.travelPerDay || '')
            });

            const set = (field, value) => setForm({ ...form, [field]: value });

            const handleSave = () => {
                onSave({
                    employeeName: form.employeeName.trim(),
                    hourlyRate: Number(form.hourlyRate) || 0,
                    tripAmount: Number(form.tripAmount) || 0,
                    tripMode: form.tripMode,
                    tripHours: parseHoursInput(form.tripHours) || DEFAULT_SETTINGS.tripHours,
                    shabbatAmount: Number(form.shabbatAmount) || 0,
                    shabbatMode: form.shabbatMode,
                    travelPerDay: Number(form.travelPerDay) || 0
                });
            };

            const field = (id, label, value, onChange, hint) => (
                <div>
                    <label htmlFor={id} className="block text-sm font-medium mb-2 text-gray-300">{label}</label>
                    <input
                        id={id}
                        type="text"
                        inputMode="decimal"
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        className="w-full bg-gray-700 rounded-xl px-4 py-3 text-base tabular focus:outline-none focus:ring-2 focus:ring-teal-500"
                    />
                    {hint && <p className="text-xs text-gray-500 mt-1">{hint}</p>}
                </div>
            );

            const modeSelect = (id, value, onChange) => (
                <select
                    id={id}
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    className="w-full bg-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 mt-2"
                >
                    <option value="add" className="bg-gray-800">בנוסף לתשלום לפי שעות</option>
                    <option value="replace" className="bg-gray-800">במקום התשלום לפי שעות</option>
                </select>
            );

            return (
                <div className="modal-backdrop fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-50 md:p-4">
                    <div className="bg-gray-800 rounded-t-3xl md:rounded-2xl p-5 md:p-6 max-w-md w-full border border-gray-700 shadow-2xl overflow-y-auto">
                        <div className="flex items-center justify-between mb-5">
                            <h2 className="text-xl md:text-2xl font-bold">הגדרות תעריפים</h2>
                            <button
                                onClick={onClose}
                                className="p-2 hover:bg-gray-700 active:bg-gray-600 rounded-lg transition-colors"
                            >
                                <X className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="space-y-4">
                            <div>
                                <label htmlFor="set-name" className="block text-sm font-medium mb-2 text-gray-300">שם העובד (לדוח)</label>
                                <input
                                    id="set-name"
                                    type="text"
                                    value={form.employeeName}
                                    onChange={(e) => set('employeeName', e.target.value)}
                                    placeholder="יופיע בכותרת הדוח החודשי"
                                    className="w-full bg-gray-700 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500 placeholder-gray-500"
                                />
                            </div>

                            {field('set-rate', 'תעריף לשעה (₪)', form.hourlyRate, (v) => set('hourlyRate', v), 'התשלום עבור כל שעת עבודה')}

                            <div>
                                {field('set-trip', 'יום טיול (₪)', form.tripAmount, (v) => set('tripAmount', v))}
                                {modeSelect('set-trip-mode', form.tripMode, (v) => set('tripMode', v))}
                            </div>

                            <div>
                                {field('set-shabbat', 'שבת (₪)', form.shabbatAmount, (v) => set('shabbatAmount', v))}
                                {modeSelect('set-shabbat-mode', form.shabbatMode, (v) => set('shabbatMode', v))}
                            </div>

                            {field('set-trip-hours', 'שעות ביום טיול', form.tripHours, (v) => set('tripHours', v), 'ברירת המחדל של אורך יום טיול')}
                            {field('set-travel', 'נסיעות ליום (₪)', form.travelPerDay, (v) => set('travelPerDay', v), 'ימולא מראש בכל רישום חדש; אפשר לשנות לכל יום')}

                            <p className="text-xs text-gray-500 bg-gray-900/50 rounded-xl p-3 leading-relaxed">
                                שינוי התעריפים משפיע גם על רישומים קיימים, כך שכל החישובים תמיד לפי התעריף העדכני.
                                הסכומים הם ברוטו — לפני הניכויים שמנוכים מהשכר.
                            </p>

                            <div className="flex gap-3">
                                <button
                                    onClick={onClose}
                                    className="flex-1 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 py-3 rounded-xl font-medium transition-colors"
                                >
                                    ביטול
                                </button>
                                <button
                                    onClick={handleSave}
                                    className="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 py-3 rounded-xl font-semibold transition-all transform active:scale-95"
                                >
                                    שמור
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- Monthly report ----------

        const escapeHtml = (value) => String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        const reportRows = (entries, settings) => entries.map(entry => {
            const extras = [];
            if (entry.isTrip) extras.push('יום טיול');
            if (entry.isShabbat) extras.push('שבת');
            return {
                date: formatDate(entry.date),
                day: dayName(entry.date),
                shifts: entry.segments.map(s => `${s.start}-${s.end}`).join(' · ') || '—',
                hours: formatHours(entry.hours),
                extras: extras.join(' + ') || '—',
                travel: entry.travel || 0,
                pay: entryPay(entry, settings),
                paid: entry.paid,
                note: entry.note || ''
            };
        });

        const buildReportHtml = (month, entries, totals, settings) => {
            const rows = reportRows(entries, settings);
            const name = settings.employeeName ? escapeHtml(settings.employeeName) : '';
            const body = rows.map(r => `
      <tr>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.day)}</td>
        <td dir="ltr" class="ltr">${escapeHtml(r.shifts)}</td>
        <td class="num">${escapeHtml(r.hours)}</td>
        <td>${escapeHtml(r.extras)}</td>
        <td class="num">${r.travel ? '₪' + r.travel : '—'}</td>
        <td class="num">₪${Math.round(r.pay * 100) / 100}</td>
        <td>${r.paid ? 'שולם' : '—'}</td>
      </tr>`).join('');

            return `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דוח שעות ${escapeHtml(formatMonth(month))}</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 32px; color: #111; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: #555; font-size: 13px; margin-bottom: 20px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 7px 9px; text-align: right; }
  th { background: #f2f2f2; font-weight: 600; }
  tbody tr:nth-child(even) { background: #fafafa; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ltr { direction: ltr; text-align: right; }
  tfoot td { font-weight: 700; background: #f2f2f2; }
  .totals { margin-top: 18px; font-size: 14px; line-height: 1.9; }
  .totals strong { font-size: 16px; }
  .footnote { margin-top: 22px; color: #666; font-size: 12px; line-height: 1.7; }
  @media print { body { margin: 12mm; } }
</style>
</head>
<body>
  <h1>דוח שעות עבודה — ${escapeHtml(formatMonth(month))}</h1>
  <div class="meta">
    ${name ? 'עובד: ' + name + ' · ' : ''}הופק בתאריך ${escapeHtml(formatDate(todayISO()))}
  </div>

  <table>
    <thead>
      <tr>
        <th>תאריך</th><th>יום</th><th>שעות משמרת</th><th>שעות</th>
        <th>תוספות</th><th>נסיעות</th><th>לתשלום</th><th>סטטוס</th>
      </tr>
    </thead>
    <tbody>${body}
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">סה״כ ${entries.length} ימי עבודה</td>
        <td class="num">${escapeHtml(formatHours(totals.hours))}</td>
        <td>${totals.tripDays} טיולים · ${totals.shabbatDays} שבתות</td>
        <td class="num">₪${Math.round(totals.travel * 100) / 100}</td>
        <td class="num">₪${Math.round(totals.pay * 100) / 100}</td>
        <td></td>
      </tr>
    </tfoot>
  </table>

  <div class="totals">
    סה״כ שעות: <strong>${escapeHtml(formatHours(totals.hours))}</strong> · תעריף שעתי: ₪${settings.hourlyRate}<br>
    ימי טיול: ${totals.tripDays} × ₪${settings.tripAmount} · שבתות: ${totals.shabbatDays} × ₪${settings.shabbatAmount}<br>
    <strong>סה״כ לתשלום (ברוטו): ₪${Math.round(totals.pay * 100) / 100}</strong>
  </div>

  <div class="footnote">
    הסכומים בדוח הם ברוטו, לפני ניכויי חובה על פי דין.<br>
