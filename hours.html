    על פי ההסכם, השכר עבור חודש זה משולם עד ${escapeHtml(payDueDate(month))}.
  </div>
</body>
</html>`;
        };

        const buildReportCsv = (month, entries, totals, settings) => {
            const rows = [['תאריך', 'יום', 'שעות משמרת', 'שעות', 'תוספות', 'נסיעות', 'לתשלום', 'סטטוס', 'הערה']];
            reportRows(entries, settings).forEach(r => {
                rows.push([r.date, r.day, r.shifts, r.hours, r.extras, r.travel, Math.round(r.pay * 100) / 100, r.paid ? 'שולם' : 'טרם שולם', r.note]);
            });
            rows.push([]);
            rows.push([`סה״כ ${entries.length} ימים`, '', '', formatHours(totals.hours), `${totals.tripDays} טיולים / ${totals.shabbatDays} שבתות`, Math.round(totals.travel * 100) / 100, Math.round(totals.pay * 100) / 100, '', '']);

            const escape = (cell) => `"${String(cell).replace(/"/g, '""')}"`;
            // BOM keeps Hebrew readable when the file is opened in Excel.
            return '﻿' + rows.map(r => r.map(escape).join(',')).join('\n');
        };

        function ReportModal({ month, entries, totals, settings, onClose, onToast }) {
            const rows = useMemo(() => reportRows(entries, settings), [entries, settings]);

            const downloadHtml = async () => {
                const blob = new Blob([buildReportHtml(month, entries, totals, settings)], { type: 'text/html;charset=utf-8;' });
                const saved = await saveFile(`work-hours-${month}.html`, blob);
                if (saved) onToast('הדוח הורד ✓');
            };

            const downloadCsv = async () => {
                const blob = new Blob([buildReportCsv(month, entries, totals, settings)], { type: 'text/csv;charset=utf-8;' });
                const saved = await saveFile(`work-hours-${month}.csv`, blob);
                if (saved) onToast('הקובץ הורד ✓');
            };

            return (
                <div className="modal-backdrop fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-50 md:p-4">
                    <div className="bg-gray-800 rounded-t-3xl md:rounded-2xl p-5 md:p-6 max-w-3xl w-full border border-gray-700 shadow-2xl overflow-y-auto">
                        <div className="flex items-center justify-between mb-1">
                            <h2 className="text-xl md:text-2xl font-bold">דוח שעות — {formatMonth(month)}</h2>
                            <button
                                onClick={onClose}
                                className="p-2 hover:bg-gray-700 active:bg-gray-600 rounded-lg transition-colors"
                            >
                                <X className="w-5 h-5" />
                            </button>
                        </div>
                        <p className="text-sm text-gray-400 mb-4">
                            {settings.employeeName ? settings.employeeName + ' · ' : ''}
                            {entries.length} ימי עבודה · הסכומים ברוטו, לפני ניכויים
                        </p>

                        <div className="overflow-x-auto rounded-xl border border-gray-700 mb-4">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-900/60 text-gray-400">
                                    <tr>
                                        <th className="text-right px-3 py-2 font-medium whitespace-nowrap">תאריך</th>
                                        <th className="text-right px-3 py-2 font-medium whitespace-nowrap">יום</th>
                                        <th className="text-right px-3 py-2 font-medium whitespace-nowrap">משמרות</th>
                                        <th className="text-right px-3 py-2 font-medium whitespace-nowrap">שעות</th>
                                        <th className="text-right px-3 py-2 font-medium whitespace-nowrap">תוספות</th>
                                        <th className="text-right px-3 py-2 font-medium whitespace-nowrap">לתשלום</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.map((r, i) => (
                                        <tr key={i} className="border-t border-gray-700/60">
                                            <td className="px-3 py-2 tabular whitespace-nowrap">{r.date}</td>
                                            <td className="px-3 py-2 whitespace-nowrap">{r.day}</td>
                                            <td className="px-3 py-2 text-gray-400 tabular whitespace-nowrap" dir="ltr" style={{ textAlign: 'right' }}>{r.shifts}</td>
                                            <td className="px-3 py-2 tabular whitespace-nowrap">{r.hours}</td>
                                            <td className="px-3 py-2 text-gray-400 whitespace-nowrap">{r.extras}</td>
                                            <td className="px-3 py-2 text-emerald-400 tabular whitespace-nowrap">{formatMoney(r.pay)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot className="bg-gray-900/60 font-semibold">
                                    <tr>
                                        <td className="px-3 py-2" colSpan={3}>סה״כ</td>
                                        <td className="px-3 py-2 tabular whitespace-nowrap">{formatHours(totals.hours)}</td>
                                        <td className="px-3 py-2 text-gray-400 whitespace-nowrap">{totals.tripDays} / {totals.shabbatDays}</td>
                                        <td className="px-3 py-2 text-emerald-400 tabular whitespace-nowrap">{formatMoney(totals.pay)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <p className="text-xs text-gray-500 mb-4">
                            לפי ההסכם, השכר עבור {formatMonth(month)} משולם עד {payDueDate(month)}.
                        </p>

                        <div className="flex flex-col sm:flex-row gap-3">
                            <button
                                onClick={downloadHtml}
                                className="flex-1 flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 py-3 rounded-xl font-semibold transition-all transform active:scale-95"
                            >
                                <Download className="w-5 h-5" />
                                הורד מסמך להדפסה
                            </button>
                            <button
                                onClick={downloadCsv}
                                className="flex-1 flex items-center justify-center gap-2 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 py-3 rounded-xl font-medium transition-colors"
                            >
                                <Download className="w-5 h-5" />
                                הורד CSV (אקסל)
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<WorkHoursApp />, document.getElementById('root'));
    </script>
</body>
</html>
