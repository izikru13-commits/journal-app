    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Heebo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #4B5563 #1F2937;
        }

        *::-webkit-scrollbar {
            width: 6px;
        }

        *::-webkit-scrollbar-track {
            background: #1F2937;
        }

        *::-webkit-scrollbar-thumb {
            background-color: #4B5563;
            border-radius: 3px;
        }

        .modal-backdrop {
            backdrop-filter: blur(8px);
        }

        button, a, input, textarea {
            min-height: 44px;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Toast notification */
        .toast {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Wordle tile reveal */
        @keyframes revealPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .tile-reveal {
            animation: revealPop 0.3s ease both;
        }

        /* Invalid guess shake */
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="js/data/words.js"></script>
    <script src="js/lib/leveling.js"></script>
    <script src="js/lib/storage.js"></script>
    <script type="text/babel" src="js/components/Toast.js"></script>
    <script type="text/babel" src="js/components/AppShell.js"></script>
    <script type="text/babel" src="js/games/wordle.js"></script>
    <script type="text/babel" src="js/app.js"></script>
</body>
</html>
