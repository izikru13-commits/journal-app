name: Build SwipeClean (iOS)

on:
  push:
    paths:
      - "gallery-cleaner/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: gallery-cleaner
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SwipeClean.xcodeproj \
            -scheme SwipeClean \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(Sources)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/SwipeClean.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SwipeClean.app Payload/
          zip -qry SwipeClean.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-ipa
          path: gallery-cleaner/SwipeClean.ipa

      - name: Upload Xcode project (for opening on a Mac)
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-xcode-project
          path: |
            gallery-cleaner/SwipeClean.xcodeproj
            gallery-cleaner/SwipeClean
