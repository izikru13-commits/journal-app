name: Rega
options:
  bundleIdPrefix: com.neriya.rega
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
  createIntermediateGroups: true
configFiles:
  Debug: Config/Rega.xcconfig
  Release: Config/Rega.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Rega:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - target: RegaShieldConfiguration
      - target: RegaShieldAction
      - target: RegaMonitor
      - target: RegaReport
      - target: RegaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Rega.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RegaShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldConfiguration
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.ShieldConfiguration
        INFOPLIST_FILE: Extensions/ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  RegaShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldAction
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.ShieldAction
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/ShieldAction.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  RegaMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Monitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.Monitor
        INFOPLIST_FILE: Extensions/Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Monitor/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  RegaReport:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Report
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.Report
        INFOPLIST_FILE: Extensions/Report/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Report/Report.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  RegaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.Widget
        INFOPLIST_FILE: Extensions/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Widget/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  RegaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Logic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.tests

  RegaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Rega
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.neriya.rega.uitests
        TEST_TARGET_NAME: Rega

schemes:
  Rega:
    build:
      targets:
        Rega: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RegaTests
    archive:
      config: Release
  RegaTests:
    build:
      targets:
        RegaTests: [test]
    test:
      config: Debug
      targets:
        - RegaTests
  RegaUITests:
    build:
      targets:
        Rega: all
        RegaUITests: [test]
    test:
      config: Debug
      targets:
        - RegaUITests
