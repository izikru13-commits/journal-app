<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לומדים אנגלית">
<meta name="theme-color" content="#f8fafc">
<meta name="description" content="אתר אינטראקטיבי ללימוד אנגלית מאפס — אלפבית, צלילים, מילים ומשפטים">
<title>לומדים אנגלית מאפס 🌟</title>
<!--
  קובץ עצמאי לחלוטין: אין בו אף בקשת רשת אחת.
  בלי ספריות, בלי פונטים חיצוניים, בלי תמונות — הכל כאן בפנים.
  לכן הוא נפתח מיידית גם אופליין, גם מקובץ שמור וגם בתצוגה מובנית באפליקציה.
-->
<style>
    :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --faint: #94a3b8;
        --line: #e2e8f0;
        --line-soft: #f1f5f9;
        --blue: #3b82f6;
        --blue-dark: #2563eb;
        --violet: #8b5cf6;
        --violet-dark: #7c3aed;
        --amber: #f59e0b;
        --amber-dark: #d97706;
        --green: #10b981;
        --green-soft: #d1fae5;
        --green-line: #6ee7b7;
        --green-ink: #047857;
        --rose-soft: #ffe4e6;
        --rose-line: #fb7185;
        --rose-ink: #be123c;
        --radius: 16px;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 12px 28px -10px rgba(15, 23, 42, 0.25);
        /* system-ui נותן באייפון את San Francisco — קריא מאוד לאותיות גדולות, ונטען מיידית */
        --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
    }

    /* כל טקסט באנגלית — כיוון הפוך מהדף, כדי שאותיות ומילים לא יישברו */
    .en {
        direction: ltr;
        unicode-bidi: isolate;
        letter-spacing: 0.02em;
    }

    button {
        font-family: inherit;
        font-size: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        min-height: 44px;               /* יעד מגע נוח לילד */
        -webkit-user-select: none;
        user-select: none;
    }

    .press { transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease; }
    .press:active { transform: scale(.95); }
    @media (hover: hover) {
        .press:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    /* ---------- הדר ---------- */
    .header {
        position: sticky; top: 0; z-index: 30;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
    }
    .header-inner { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 960px; margin: 0 auto; }
    .icon-btn {
        flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
        background: var(--line-soft); color: var(--muted);
        display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .icon-btn:active { background: var(--line); }
    .progress-wrap { flex: 1; min-width: 0; }
    .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .progress-label b { color: var(--ink); }
    .progress-track { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(to left, #34d399, var(--green)); border-radius: 999px; transition: width .5s ease; }
    .stars {
        flex-shrink: 0; display: flex; align-items: center; gap: 4px;
        background: #fef3c7; color: var(--amber-dark);
        padding: 8px 12px; border-radius: 12px; font-weight: 800; font-size: 18px;
    }

    /* ---------- ניווט שלבים ---------- */
    .stage-nav { display: flex; gap: 8px; overflow-x: auto; padding: 16px 16px 4px; max-width: 960px; margin: 0 auto; scrollbar-width: none; }
    .stage-nav::-webkit-scrollbar { display: none; }
    .stage-btn {
        flex-shrink: 0; display: flex; align-items: center; gap: 8px;
        padding: 8px 16px; border-radius: var(--radius);
        border: 2px solid var(--line); background: var(--card); color: var(--muted);
        font-weight: 700; white-space: nowrap;
    }
    .stage-btn .emo { font-size: 20px; }
    .stage-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: var(--shadow); }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--line-soft); color: var(--faint); font-weight: 700; }
    .stage-btn.active .badge { background: rgba(255,255,255,.25); color: #fff; }

    /* ---------- באנר אין-שמע ---------- */
    .banner { background: #fef3c7; border-bottom: 1px solid #fcd34d; color: #92400e; text-align: center; padding: 12px 16px; font-weight: 700; }

    /* ---------- מסך בית ---------- */
    .home { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; text-align: center; }
    .home-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
    .home h1 { font-size: 32px; font-weight: 800; margin: 0 0 12px; }
    .home p { color: var(--muted); font-size: 18px; margin: 0 0 8px; }
    .home .small { color: var(--faint); font-size: 16px; margin-bottom: 28px; }
    .start-btn {
        background: var(--blue); color: #fff; font-size: 20px; font-weight: 800;
        padding: 18px 40px; border-radius: 24px; box-shadow: var(--shadow-lg); margin-bottom: 16px;
    }
    .start-btn:active { background: var(--blue-dark); }
    .stage-list { display: grid; gap: 12px; margin-top: 32px; text-align: right; }
    .stage-card {
        display: flex; align-items: center; gap: 16px; text-align: right;
        background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
        padding: 16px; box-shadow: var(--shadow); width: 100%;
    }
    .stage-card .emo { font-size: 36px; flex-shrink: 0; }
    .stage-card .txt { flex: 1; min-width: 0; }
    .stage-card .t { display: block; font-weight: 800; font-size: 18px; }
    .stage-card .d { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .pill { flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--line-soft); color: var(--faint); }
    .pill.ready { background: var(--green-soft); color: var(--green-ink); }

    /* ---------- כותרת שלב + לשוניות ---------- */
    .stage-head { text-align: center; margin: 20px 0; }
    .stage-head h2 { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
    .stage-head p { color: var(--muted); margin: 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .tab-btn {
        display: flex; align-items: center; gap: 8px; padding: 10px 20px;
        border-radius: var(--radius); border: 2px solid var(--line);
        background: var(--card); color: var(--muted); font-weight: 700;
    }
    .tab-btn.active { background: #1e293b; border-color: #1e293b; color: #fff; }

    .instruct { text-align: center; color: var(--muted); font-size: 18px; margin-bottom: 16px; }

    /* ---------- רשת האותיות ---------- */
    .grid-letters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 480px) { .grid-letters { grid-template-columns: repeat(4, 1fr); gap: 12px; } }
    @media (min-width: 768px) { .grid-letters { grid-template-columns: repeat(6, 1fr); gap: 12px; } }
    .letter-card {
        position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius);
        border: 2px solid var(--line); background: var(--card); box-shadow: var(--shadow);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .letter-card.learned { border-color: var(--green-line); }
    .letter-glyph { font-size: 32px; font-weight: 800; line-height: 1; }
    @media (min-width: 768px) { .letter-glyph { font-size: 38px; } }
    .letter-emoji { font-size: 22px; line-height: 1; }
    .check {
        position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%;
        background: var(--green); color: #fff; font-size: 12px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
    }

    /* ---------- כרטיס אות ---------- */
    .overlay {
        position: fixed; inset: 0; z-index: 40; background: rgba(15,23,42,.5);
        backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center;
    }
    @media (min-width: 768px) { .overlay { align-items: center; } }
    .sheet {
        background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
        border-radius: 24px 24px 0 0; padding: 24px; box-shadow: var(--shadow-lg);
        animation: sheetUp .28s ease-out;
    }
    @media (min-width: 768px) { .sheet { border-radius: 24px; animation: popIn .3s ease-out; } }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .sheet-head span { font-size: 14px; font-weight: 700; color: var(--faint); }
    .close-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--line-soft); color: var(--muted); font-size: 20px; display: flex; align-items: center; justify-content: center; }
    .detail-main { text-align: center; margin-bottom: 24px; }
    .detail-glyph { font-size: 72px; font-weight: 800; line-height: 1; margin-bottom: 12px; }
    .detail-emoji { font-size: 56px; line-height: 1; margin-bottom: 8px; animation: popIn .35s ease-out; }
    .detail-word { font-size: 36px; font-weight: 800; color: var(--blue); line-height: 1.2; }
    .detail-he { font-size: 20px; color: var(--muted); margin-top: 2px; }
    .note { display: inline-block; margin-top: 12px; background: #fffbeb; color: #92400e; font-size: 14px; padding: 6px 12px; border-radius: 10px; }
    .speak-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .speak-btn {
        flex: 1 1 120px; border-radius: var(--radius); padding: 12px 16px; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        box-shadow: var(--shadow);
    }
    .speak-btn .lbl { font-size: 16px; font-weight: 800; line-height: 1.2; }
    .speak-btn .sub { font-size: 12px; opacity: .9; }
    .speak-btn .ico { font-size: 20px; line-height: 1; }
    .speak-btn.blue { background: var(--blue); }
    .speak-btn.violet { background: var(--violet); }
    .speak-btn.amber { background: var(--amber); }
    .nav-row { display: flex; gap: 12px; }
    .nav-btn { flex: 1; border-radius: var(--radius); padding: 12px; font-weight: 700; background: var(--line-soft); color: #334155; }
    .nav-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ---------- משחקים ---------- */
    .hint-box { border-radius: var(--radius); padding: 16px; margin-bottom: 20px; text-align: center; }
    .hint-box .t { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .hint-box .d { color: var(--muted); }
    .hint-box.blue { background: #eff6ff; border: 1px solid #bfdbfe; }
    .hint-box.blue .t { color: #1e3a8a; }
    .hint-box.violet { background: #f5f3ff; border: 1px solid #ddd6fe; }
    .hint-box.violet .t { color: #4c1d95; }

    .game-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; margin: 0 auto; }
    @media (min-width: 768px) { .game-cols { gap: 24px; } }
    .col-title { text-align: center; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .cells { display: grid; gap: 12px; }
    .game-cell {
        height: 76px; border-radius: var(--radius); border: 2px solid var(--line);
        background: var(--card); font-size: 34px; font-weight: 800; box-shadow: var(--shadow);
        display: flex; align-items: center; justify-content: center;
    }
    .game-cell.selected { background: var(--blue); border-color: var(--blue); color: #fff; transform: scale(1.05); }
    .game-cell.matched { background: var(--green-soft); border-color: var(--green-line); color: var(--green-ink); animation: successFlash .45s ease-out; }
    .game-cell.wrong { background: var(--rose-soft); border-color: var(--rose-line); color: var(--rose-ink); animation: shake .4s ease-in-out; }

    .listen-btn {
        display: inline-flex; align-items: center; gap: 12px; margin: 0 auto 24px;
        background: var(--violet); color: #fff; padding: 18px 32px; border-radius: 24px;
        font-size: 20px; font-weight: 800; box-shadow: var(--shadow-lg);
    }
    .center { text-align: center; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; margin: 0 auto; }
    .option-cell {
        height: 108px; border-radius: var(--radius); border: 2px solid var(--line);
        background: var(--card); font-size: 44px; font-weight: 800; box-shadow: var(--shadow);
        display: flex; align-items: center; justify-content: center;
    }
    .option-cell.correct { background: var(--green-soft); border-color: var(--green-line); color: var(--green-ink); animation: successFlash .45s ease-out; }
    .option-cell.dim { background: var(--line-soft); color: var(--line); border-color: var(--line-soft); }
    .ghost-btn { border-radius: var(--radius); padding: 12px 24px; background: var(--line-soft); color: #334155; font-weight: 700; }
    .reveal { text-align: center; margin-top: 24px; animation: popIn .35s ease-out; }
    .reveal .big { font-size: 44px; line-height: 1; }
    .reveal .word { font-size: 22px; font-weight: 800; color: var(--green-ink); margin-top: 8px; }

    /* ---------- בקרוב ---------- */
    .coming { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
    .coming .emo { font-size: 64px; margin-bottom: 16px; }
    .coming h2 { font-size: 26px; font-weight: 800; margin: 0 0 12px; }
    .coming p { color: var(--muted); font-size: 18px; line-height: 1.6; margin: 0 0 28px; }
    .coming .box { display: inline-block; background: #fffbeb; border: 2px solid #fcd34d; color: #92400e; border-radius: var(--radius); padding: 16px 24px; font-size: 18px; font-weight: 700; }
    .coming .after { margin-top: 24px; color: var(--faint); font-size: 16px; }

    /* ---------- טוסט ---------- */
    .toast {
        position: fixed; bottom: 24px; left: 50%; z-index: 50;
        background: var(--green); color: #fff; padding: 12px 24px; border-radius: 16px;
        font-size: 18px; font-weight: 800; box-shadow: var(--shadow-lg); pointer-events: none;
        animation: slideUp .3s ease-out; transform: translateX(-50%);
    }

    /* ---------- אנימציות ---------- */
    @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 120%); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
    @keyframes popIn { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes successFlash { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes speakPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,.5); } 50% { box-shadow: 0 0 0 10px rgba(59,130,246,0); } }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .speaking { animation: speakPulse 1s ease-out infinite; }


    /* ---------- שלב 2: מילים ופירוקן ---------- */
    .word-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 480px) { .word-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
    @media (min-width: 768px) { .word-grid { grid-template-columns: repeat(5, 1fr); } }
    .word-card {
        border-radius: var(--radius); border: 2px solid var(--line); background: var(--card);
        box-shadow: var(--shadow); padding: 16px 8px;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .word-card.learned { border-color: var(--green-line); }
    .word-card .emo { font-size: 30px; line-height: 1; }
    .word-card .w { font-size: 24px; font-weight: 800; }

    .vowel-label { text-align: center; font-weight: 700; color: var(--faint); margin: 24px 0 8px; }
    .vowel-label:first-child { margin-top: 0; }
    .vowel-label b { color: var(--violet); font-size: 20px; }

    .chips { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; direction: ltr; }
    .letter-chip {
        width: 72px; height: 88px; border-radius: var(--radius);
        border: 2px solid var(--line); background: var(--card); box-shadow: var(--shadow);
        font-size: 44px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
    }
    .letter-chip.vowel { border-color: #ddd6fe; background: #f5f3ff; color: var(--violet-dark); }

    .translate-toggle {
        display: block; margin: 0 auto 16px; border-radius: 999px; padding: 10px 24px;
        background: var(--line-soft); color: #334155; font-weight: 700;
    }
    .he-reveal {
        text-align: center; font-size: 22px; color: var(--muted);
        background: var(--line-soft); border-radius: var(--radius); padding: 12px; margin-bottom: 16px;
    }

    /* ---------- שלב 3: אוצר מילים ---------- */
    .vocab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 480px) { .vocab-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
    @media (min-width: 768px) { .vocab-grid { grid-template-columns: repeat(4, 1fr); } }
    .vocab-card {
        border-radius: var(--radius); border: 2px solid var(--line); background: var(--card);
        box-shadow: var(--shadow); padding: 16px 8px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .vocab-card.learned { border-color: var(--green-line); }
    .vocab-card .emo { font-size: 40px; line-height: 1; }
    .vocab-card .w { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .vocab-card .he { font-size: 15px; color: var(--muted); }
    .vocab-card .spk { font-size: 18px; color: var(--blue); }

    /* ---------- שלב 4: משפטים ---------- */
    .sentence-box {
        background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 24px 16px; margin-bottom: 20px;
    }
    .sentence { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; direction: ltr; }
    .sentence-word {
        font-size: 28px; font-weight: 700; padding: 8px 12px; border-radius: 12px;
        border: 2px solid transparent; background: var(--line-soft); color: var(--ink);
    }
    .sentence-word:active, .sentence-word.speaking { border-color: var(--blue); background: #eff6ff; }
    @media (min-width: 768px) { .sentence-word { font-size: 34px; } }

    .play-all {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        margin: 0 auto 16px; background: var(--green); color: #fff;
        padding: 16px 32px; border-radius: 20px; font-size: 19px; font-weight: 800;
        box-shadow: var(--shadow-lg);
    }

    /* סידור משפט */
    .slot-row {
        display: flex; flex-wrap: wrap; gap: 8px; direction: ltr; justify-content: center;
        min-height: 60px; padding: 12px; border-radius: var(--radius);
        border: 2px dashed var(--line); margin-bottom: 16px;
    }
    .slot-row.done { border-color: var(--green-line); background: var(--green-soft); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; direction: ltr; justify-content: center; }
    .chip {
        font-size: 22px; font-weight: 700; padding: 10px 16px; border-radius: 12px;
        background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow);
    }
    .chip.used { opacity: .3; }
    .chip.wrong { background: var(--rose-soft); border-color: var(--rose-line); color: var(--rose-ink); animation: shake .4s ease-in-out; }
    .chip.placed { background: #eff6ff; border-color: var(--blue); }

    /* ---------- שלב 5: משחקים ---------- */
    .pic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; margin: 0 auto; }
    .pic-option {
        border-radius: var(--radius); border: 2px solid var(--line); background: var(--card);
        box-shadow: var(--shadow); padding: 20px 8px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .pic-option .emo { font-size: 48px; line-height: 1; }
    .pic-option .he { font-size: 15px; color: var(--muted); }
    .pic-option.correct { background: var(--green-soft); border-color: var(--green-line); animation: successFlash .45s ease-out; }
    .pic-option.dim { opacity: .35; }

    .missing-row { display: flex; justify-content: center; gap: 10px; direction: ltr; margin-bottom: 8px; }
    .slot {
        width: 72px; height: 88px; border-radius: var(--radius);
        display: flex; align-items: center; justify-content: center;

        var node = document.createElement(tag), k, v, i, child;
        if (props) {
            for (k in props) {
                if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
                v = props[k];
                if (v === null || v === undefined || v === false) continue;
                if (k === 'class') node.className = v;

                else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2).toLowerCase(), v);
                else node.setAttribute(k, v);
            }
        }
        for (i = 2; i < arguments.length; i++) {
            child = arguments[i];
            if (child === null || child === undefined || child === false) continue;
            if (Array.isArray(child)) {
                child.forEach(function (c) { if (c) node.appendChild(c); });

        try {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                var start = now + i * 0.09;
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.3);
            });

    }

                    en.filter(function (v) { return /^en[-_]gb/i.test(v.lang || ''); })[0] ||

        say: function (text, rate, node) {
            if (!this.supported || !text) return;
            var synth = window.speechSynthesis;
            try { synth.cancel(); } catch (e) { /* noop */ }
            var prev = document.querySelector('.speaking');
            if (prev) prev.classList.remove('speaking');
            var utter = new SpeechSynthesisUtterance(String(text));
            if (this.voice) utter.voice = this.voice;
            utter.lang = (this.voice && this.voice.lang) || 'en-US';
            utter.rate = typeof rate === 'number' ? rate : 0.8;
            utter.pitch = 1;
            utter.volume = 1;
            if (node) {
                utter.onstart = function () { node.classList.add('speaking'); };
                utter.onend = function () { node.classList.remove('speaking'); };
                utter.onerror = function () { node.classList.remove('speaking'); };
            }
            try { synth.speak(utter); } catch (e) { if (node) node.classList.remove('speaking'); }
        },

        // הקראת רצף — c-a-t ואז cat. לא משתמשים ב-say() כי הוא מבטל את התור בכל קריאה.
        sequence: function (items, node) {
            if (!this.supported || !items.length) return;
            var self = this, i = 0, finished = false;
            try { window.speechSynthesis.cancel(); } catch (e) { /* noop */ }

            function done() {
                if (finished) return;
                finished = true;
                if (node) node.classList.remove('speaking');
            }
            // רשת ביטחון: בדפדפן בלי קולות מותקנים onend עלול לא לירות כלל
            setTimeout(done, 800 + items.length * 1200);

            function next() {
                if (finished) return;
                if (i >= items.length) { done(); return; }
                var item = items[i++];
                var utter = new SpeechSynthesisUtterance(String(item.text));
                if (self.voice) utter.voice = self.voice;
                utter.lang = (self.voice && self.voice.lang) || 'en-US';

                try { window.speechSynthesis.speak(utter); } catch (e) { next(); }

            next();
        },

        } catch (e) { /* התקדמות פגומה או אחסון חסום — מתחילים מאפס */ }
    }

    function save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                stars: state.stars,
                seen: state.seen,
                // נשמר גם במבנה הישן, כדי שגרסה קודמת של הדף לא תאבד התקדמות
                lettersLearned: state.seen
                    .filter(function (k) { return k.indexOf('letter:') === 0; })
                    .map(function (k) { return k.slice(7); })
            }));
        } catch (e) { /* אחסון חסום — האתר ממשיך לעבוד, פשוט בלי זיכרון */ }
    }

    function addStar() {
        state.stars++;
        save();
        updateHeader();
    }

    function markSeen(key) {
        if (state.seen.indexOf(key) !== -1) return;
        state.seen.push(key);
        save();
        updateHeader();
    }

    function hasSeen(key) { return state.seen.indexOf(key) !== -1; }

    function countSeen(prefix) {
        return state.seen.filter(function (k) { return k.indexOf(prefix) === 0; }).length;
    }

    // מד ההתקדמות מותאם לשלב שנמצאים בו
    function progressFor(screen) {
        if (screen === 1) return { label: 'אותיות שלמדת', value: countSeen('letter:'), max: ALPHABET.length };
        if (screen === 2) return { label: 'מילים שקראת',  value: countSeen('word:'),   max: CVC_WORDS.length };
        if (screen === 3) return { label: 'מילים שלמדת',  value: countSeen('vocab:'),  max: vocabTotal() };
        if (screen === 4) return { label: 'משפטים שקראת', value: countSeen('sentence:'), max: SENTENCES.length };
        var total = ALPHABET.length + CVC_WORDS.length + vocabTotal() + SENTENCES.length;
        return { label: 'התקדמות כללית', value: state.seen.length, max: total };
    }

    function vocabTotal() {
        var n = 0;
        VOCAB.forEach(function (cat) { n += cat.items.length; });
        return n;
    }

    /* =========================================================================
       טוסט
       ========================================================================= */
    var toastTimer = null;
    function toast(message) {
        var old = document.querySelector('.toast');
        if (old) old.parentNode.removeChild(old);
        if (toastTimer) clearTimeout(toastTimer);
        var node = el('div', { class: 'toast', text: message });
        document.body.appendChild(node);
        toastTimer = setTimeout(function () {
            if (node.parentNode) node.parentNode.removeChild(node);
        }, 1800);
    }

    /* =========================================================================
       הדר וניווט
       ========================================================================= */

    // מעדכן את המונים במקום, בלי לבנות מחדש את המסך — כדי לא לאפס משחק פעיל
    function updateHeader() {
        var fill = document.getElementById('progress-fill');
        var count = document.getElementById('progress-count');
        var stars = document.getElementById('star-count');
        var pr = progressFor(state.screen);
        var label = document.getElementById('progress-label');
        if (fill) fill.style.width = (pr.max ? Math.round((pr.value / pr.max) * 100) : 0) + '%';
        if (count) count.textContent = pr.value + ' / ' + pr.max;
        if (label) label.textContent = pr.label;
        if (stars) stars.textContent = String(state.stars);
    }

    function buildHeader() {
        var pr = progressFor(state.screen);
        var pct = pr.max ? Math.round((pr.value / pr.max) * 100) : 0;
        return el('header', { class: 'header' },
            el('div', { class: 'header-inner' },
                el('button', {
                    class: 'icon-btn press', 'aria-label': 'חזרה למסך הבית', text: '🏠',
                    onclick: function () { go('home'); }
                }),
                el('div', { class: 'progress-wrap' },
                    el('div', { class: 'progress-label' },
                        el('span', { id: 'progress-label', text: pr.label }),
                        el('b', { id: 'progress-count', dir: 'ltr',
                                  text: pr.value + ' / ' + pr.max })
                    ),
                    el('div', { class: 'progress-track' },
                        el('div', { id: 'progress-fill', class: 'progress-fill', style: 'width:' + pct + '%' })
                    )
                ),
                el('div', { class: 'stars' },
                    el('span', { text: '⭐' }),
                    el('span', { id: 'star-count', text: String(state.stars) })
                )

                    class: 'stage-btn press' + (active ? ' active' : ''),

            ));

    function go(screen) {
        speech.unlock();
        state.screen = screen;
        render();
        window.scrollTo(0, 0);

    /* =========================================================================
       שלב 1 — רשת האותיות וכרטיס האות
       ========================================================================= */

    function buildAlphabetGrid() {
        // dir="ltr" חובה: בלי זה האלפבית נקרא הפוך בתוך דף RTL — Cc Bb Aa
        var grid = el('div', { class: 'grid-letters', dir: 'ltr' });
        ALPHABET.forEach(function (letter, i) {
            var learned = hasSeen('letter:' + letter.upper);
            var card = el('button', {
                    class: 'letter-card press' + (learned ? ' learned' : ''),
                    'aria-label': 'האות ' + letter.upper,
                    onclick: function () { openLetter(i); }
                },
                learned ? el('span', { class: 'check', text: '✓' }) : null,
                el('span', { class: 'letter-glyph en', text: letter.upper + letter.lower }),
                el('span', { class: 'letter-emoji', text: letter.emoji })
            );
            grid.appendChild(card);
        });

        return el('div', null,
            el('p', { class: 'instruct', text: 'לחץ על כל אות כדי לשמוע איך קוראים לה 👇' }),
            grid
        );
    }

    var sheetKeyHandler = null;

    function closeSheet() {
        var overlay = document.querySelector('.overlay');
        if (overlay) overlay.parentNode.removeChild(overlay);
        if (sheetKeyHandler) {
            window.removeEventListener('keydown', sheetKeyHandler);
            sheetKeyHandler = null;
        }
    }

    function openLetter(index) {
        if (index < 0 || index >= ALPHABET.length) return;
        var letter = ALPHABET[index];

        markSeen('letter:' + letter.upper);

        // מסמנים ✓ על הכרטיס ברשת בלי לבנות את המסך מחדש
        var cards = document.querySelectorAll('.letter-card');
        if (cards[index] && !cards[index].classList.contains('learned')) {
            cards[index].classList.add('learned');
            cards[index].insertBefore(el('span', { class: 'check', text: '✓' }), cards[index].firstChild);
        }

        closeSheet();

        function speakBtn(cls, label, hint, text, rate) {
            var btn = el('button', { class: 'speak-btn press ' + cls },
                el('span', { class: 'ico', text: '🔊' }),
                el('span', { class: 'lbl', text: label }),
                el('span', { class: 'sub en', text: hint })
            );
            btn.addEventListener('click', function () { speech.say(text, rate, btn); });
            return btn;
        }

        var prevBtn = el('button', { class: 'nav-btn press', text: '→ הקודמת',
            onclick: function () { openLetter(index - 1); } });
        var nextBtn = el('button', { class: 'nav-btn press', text: 'הבאה ←',
            onclick: function () { openLetter(index + 1); } });
        if (index === 0) prevBtn.disabled = true;
        if (index === ALPHABET.length - 1) nextBtn.disabled = true;

        var sheet = el('div', { class: 'sheet' },
            el('div', { class: 'sheet-head' },
                el('span', { text: 'אות ' + (index + 1) + ' מתוך ' + ALPHABET.length }),
                el('button', { class: 'close-btn press', 'aria-label': 'סגירה', text: '✕',
                               onclick: closeSheet })
            ),
            el('div', { class: 'detail-main' },
                el('div', { class: 'detail-glyph en', text: letter.upper + letter.lower }),
                el('div', { class: 'detail-emoji', text: letter.emoji }),
                el('div', { class: 'detail-word en', text: letter.word }),
                el('div', { class: 'detail-he', text: letter.he }),
                letter.note ? el('div', { class: 'note', text: '💡 ' + letter.note }) : null
            ),
            el('p', { class: 'instruct', text: 'לחץ כדי לשמוע:' }),
            el('div', { class: 'speak-row' },
                speakBtn('blue', 'שם האות', letter.name, letter.name, 0.7),
                speakBtn('violet', 'הצליל', letter.sound, letter.sound, 0.7),
                speakBtn('amber', 'המילה', letter.word, letter.word, 0.8)
            ),
            el('div', { class: 'nav-row' }, prevBtn, nextBtn)
        );

        var overlay = el('div', { class: 'overlay',
            onclick: function (e) { if (e.target === overlay) closeSheet(); } }, sheet);

        document.body.appendChild(overlay);
        speech.say(letter.name, 0.7);

        sheetKeyHandler = function (e) {
            if (e.key === 'Escape') closeSheet();
            else if (e.key === 'ArrowRight') openLetter(index - 1);
            else if (e.key === 'ArrowLeft') openLetter(index + 1);
        };
        window.addEventListener('keydown', sheetKeyHandler);
    }

    /* =========================================================================
       שלב 1 — משחק א': התאמת אות גדולה לקטנה
       ========================================================================= */
    function buildMatchGame() {
        var cols = el('div', { class: 'game-cols' });
        var round, selectedUpper, matched, upperNodes, lowerNodes;

        function cellFor(letter, isUpper) {
            var node = el('button', { class: 'game-cell press en',
                                      text: isUpper ? letter.upper : letter.lower });
            node.addEventListener('click', function () {
                if (isUpper) clickUpper(letter, node); else clickLower(letter, node);
            });
            return node;
        }

        function clickUpper(letter, node) {
            if (matched.indexOf(letter.upper) !== -1) return;
            upperNodes.forEach(function (n) { n.classList.remove('selected'); });
            node.classList.add('selected');
            selectedUpper = letter.upper;
            speech.say(letter.name, 0.7);
        }

        function clickLower(letter, node) {
            if (matched.indexOf(letter.upper) !== -1) return;

            if (!selectedUpper) {                       // עוד לא נבחרה אות גדולה
                speech.say(letter.name, 0.7);
                return;
            }

            if (selectedUpper === letter.upper) {
                var idx = round.map(function (l) { return l.upper; }).indexOf(letter.upper);
                upperNodes[idx].classList.remove('selected');
                upperNodes[idx].classList.add('matched');
                node.classList.add('matched');
                matched.push(letter.upper);
                selectedUpper = null;
                playSuccessTone();
                addStar();
                speech.say(letter.name, 0.7);
                if (matched.length === round.length) {
                    toast('סיימת את הסבב! 🎊');
                    setTimeout(newRound, 1400);
                } else {
                    toast(praise());
                }
            } else {
                // טעות: רעידה קצרה ואיפוס הבחירה — בלי הפחתת כוכבים
                node.classList.add('wrong');
                setTimeout(function () { node.classList.remove('wrong'); }, 450);
                upperNodes.forEach(function (n) { n.classList.remove('selected'); });
                selectedUpper = null;
            }
        }

        function newRound() {
            round = sample(ALPHABET, 4);
            selectedUpper = null;
            matched = [];
            upperNodes = round.map(function (l) { return cellFor(l, true); });
            var shuffled = shuffle(round);
            lowerNodes = shuffled.map(function (l) { return cellFor(l, false); });

            cols.textContent = '';
            cols.appendChild(el('div', null,
                el('h3', { class: 'col-title', text: 'אותיות גדולות' }),
                el('div', { class: 'cells' }, upperNodes)
            ));
            cols.appendChild(el('div', null,
                el('h3', { class: 'col-title', text: 'אותיות קטנות' }),
                el('div', { class: 'cells' }, lowerNodes)
            ));
        }

        newRound();

        return el('div', null,
            el('div', { class: 'hint-box blue' },
                el('div', { class: 't', text: 'איך משחקים?' }),
                el('div', { class: 'd', text: 'לחץ קודם על אות גדולה בטור הימני, ואז על אותה אות קטנה בטור השמאלי.' })
            ),
            cols,
            el('div', { class: 'center', style: 'margin-top:24px' },
                el('button', { class: 'ghost-btn press', text: '🔄 אותיות אחרות', onclick: newRound })
            )
        );
    }

    /* =========================================================================
       שלב 1 — משחק ב': שומעים ובוחרים את האות הנכונה
       ========================================================================= */
    function buildListenGame() {
        var titleNode = el('div', { class: 't' });
        var optionsGrid = el('div', { class: 'options-grid' });
        var revealSlot = el('div');
        var footerSlot = el('div', { class: 'center', style: 'margin-top:24px' });
        var listenBtn = el('button', { class: 'listen-btn press' },
            el('span', { text: '🔊' }),
            el('span', { text: 'שמע שוב' })
        );

        var target, mode, solved, promptTimer;

        function playPrompt() {
            speech.say(mode === 'name' ? target.name : target.sound, 0.7, listenBtn);
        }
        listenBtn.addEventListener('click', playPrompt);

        function pick(letter, node) {
            if (solved) return;
            if (letter.upper === target.upper) {
                solved = true;
                node.classList.add('correct');
                playSuccessTone();
                addStar();
                toast(praise());
                revealSlot.appendChild(el('div', { class: 'reveal' },
                    el('div', { class: 'big', text: '🎉' }),
                    el('div', { class: 'word en',
                                text: target.upper + target.lower + ' — ' + target.word })
                ));
                footerSlot.textContent = '';
                setTimeout(newQuestion, 1600);
            } else {
                // טעות: האפשרות מתעמעמת, אפשר לנסות שוב — בלי עונש
                node.classList.add('dim');
                node.disabled = true;
            }
        }

        function newQuestion() {
            var options = sample(ALPHABET, 4);
            target = options[Math.floor(Math.random() * options.length)];
            mode = Math.random() < 0.5 ? 'name' : 'sound';
            solved = false;

            titleNode.textContent = mode === 'name' ? 'איזו אות שמעת?' : 'איזו אות עושה את הצליל הזה?';
            revealSlot.textContent = '';
            optionsGrid.textContent = '';

            options.forEach(function (letter) {
                var node = el('button', { class: 'option-cell press en',
                                          text: letter.upper + letter.lower });
                node.addEventListener('click', function () { pick(letter, node); });
                optionsGrid.appendChild(node);
            });

            footerSlot.textContent = '';
            footerSlot.appendChild(el('button', { class: 'ghost-btn press', text: 'שאלה אחרת ←',
                                                  onclick: newQuestion }));

            if (promptTimer) clearTimeout(promptTimer);
            promptTimer = setTimeout(playPrompt, 350);
        }

        newQuestion();

        return el('div', null,
            el('div', { class: 'hint-box violet' },
                titleNode,
                el('div', { class: 'd', text: 'הקשב ואז לחץ על האות הנכונה. אפשר לשמוע שוב כמה פעמים שרוצים.' })
            ),
            el('div', { class: 'center', style: 'margin-bottom:8px' }, listenBtn),
            optionsGrid,
            revealSlot,
            footerSlot
        );
    }


    /* =========================================================================
       שלב 2 — מילים קצרות (CVC)
       ========================================================================= */

    function isVowel(ch) { return 'aeiou'.indexOf(String(ch).toLowerCase()) !== -1; }

    function openWord(index) {
        if (index < 0 || index >= CVC_WORDS.length) return;
        var word = CVC_WORDS[index];
        markSeen('word:' + word.w);

        // סימון הכרטיס ברשת בלי לבנות את המסך מחדש
        var cards = document.querySelectorAll('.word-card');
        if (cards[index]) cards[index].classList.add('learned');

        closeSheet();

        var chars = word.w.split('');

        // כל אות ככפתור נפרד — לחיצה משמיעה את הצליל שלה, לא את שמה
        var chips = el('div', { class: 'chips' });
        chars.forEach(function (ch) {
            var info = letterInfo(ch);
            var chip = el('button', {
                class: 'letter-chip press en' + (isVowel(ch) ? ' vowel' : ''),
                text: ch
            });
            chip.addEventListener('click', function () {
                if (info) speech.say(info.sound, 0.7, chip);
            });
            chips.appendChild(chip);
        });

        var blendBtn = el('button', { class: 'play-all press' },
            el('span', { text: '🔊' }),
            el('span', { text: 'חבר את הצלילים' })
        );
        blendBtn.addEventListener('click', function () {
            var items = chars.map(function (ch) {
                var info = letterInfo(ch);
                return { text: info ? info.sound : ch, rate: 0.7, gap: 200 };
            });
            items.push({ text: word.w, rate: 0.75 });
            speech.sequence(items, blendBtn);
        });

        var heBox = el('div', { class: 'he-reveal', text: word.he });
        heBox.hidden = true;
        var toggle = el('button', { class: 'translate-toggle press', text: '👁️ הצג תרגום' });
        toggle.addEventListener('click', function () {
            heBox.hidden = !heBox.hidden;
            toggle.textContent = heBox.hidden ? '👁️ הצג תרגום' : '🙈 הסתר תרגום';
        });

        var wordBtn = el('button', { class: 'detail-word en press', text: word.w });
        wordBtn.addEventListener('click', function () { speech.say(word.w, 0.75, wordBtn); });

        var prevBtn = el('button', { class: 'nav-btn press', text: '→ הקודמת',
            onclick: function () { openWord(index - 1); } });
        var nextBtn = el('button', { class: 'nav-btn press', text: 'הבאה ←',
            onclick: function () { openWord(index + 1); } });
        if (index === 0) prevBtn.disabled = true;
        if (index === CVC_WORDS.length - 1) nextBtn.disabled = true;

        var sheet = el('div', { class: 'sheet' },
            el('div', { class: 'sheet-head' },
                el('span', { text: 'מילה ' + (index + 1) + ' מתוך ' + CVC_WORDS.length }),
                el('button', { class: 'close-btn press', 'aria-label': 'סגירה', text: '✕',
                               onclick: closeSheet })
            ),
            el('div', { class: 'detail-main' },
                el('div', { class: 'detail-emoji', text: word.emoji }),
                wordBtn
            ),
            el('p', { class: 'instruct', text: 'לחץ על כל אות כדי לשמוע את הצליל שלה:' }),
            chips,
            blendBtn,
            toggle,
            heBox,
            el('div', { class: 'nav-row' }, prevBtn, nextBtn)
        );

        var overlay = el('div', { class: 'overlay',
            onclick: function (e) { if (e.target === overlay) closeSheet(); } }, sheet);
        document.body.appendChild(overlay);

        sheetKeyHandler = function (e) {
            if (e.key === 'Escape') closeSheet();
            else if (e.key === 'ArrowRight') openWord(index - 1);
            else if (e.key === 'ArrowLeft') openWord(index + 1);
        };
        window.addEventListener('keydown', sheetKeyHandler);
    }

    function buildWordGrid() {
        var wrap = el('div', null,
            el('p', { class: 'instruct', text: 'כל מילה בנויה משלושה צלילים. לחץ על מילה כדי לפרק אותה 👇' })
        );

        // קיבוץ לפי התנועה — כך לומדים לקרוא מילים קצרות
        ['a', 'e', 'i', 'o', 'u'].forEach(function (vowel) {
            var words = CVC_WORDS.filter(function (x) { return x.v === vowel; });
            if (!words.length) return;
            wrap.appendChild(el('p', { class: 'vowel-label' },
                'מילים עם התנועה ',
                el('b', { class: 'en', text: vowel })
            ));
            var grid = el('div', { class: 'word-grid', dir: 'ltr' });
            words.forEach(function (word) {
                var index = CVC_WORDS.indexOf(word);
                grid.appendChild(el('button', {
                        class: 'word-card press' + (hasSeen('word:' + word.w) ? ' learned' : ''),
                        onclick: function () { openWord(index); }
                    },
                    el('span', { class: 'emo', text: word.emoji }),
                    el('span', { class: 'w en', text: word.w })
                ));
            });
            wrap.appendChild(grid);
        });

        return wrap;
    }

    /* תרגול פענוח: רואים מילה כתובה ובוחרים את התמונה — בלי שמע */
    function buildReadAndPick() {
        var wordSlot = el('div', { class: 'detail-word en', style: 'font-size:52px;text-align:center;margin-bottom:24px' });
        var grid = el('div', { class: 'pic-grid' });
        var footer = el('div', { class: 'center', style: 'margin-top:24px' });
        var target, solved;

        function nextQuestion() {
            var options = sample(CVC_WORDS, 4);
            target = options[Math.floor(Math.random() * options.length)];
            solved = false;
            wordSlot.textContent = target.w;
            grid.textContent = '';

            options.forEach(function (word) {
                var node = el('button', { class: 'pic-option press' },
                    el('span', { class: 'emo', text: word.emoji }),
                    el('span', { class: 'he', text: word.he })
                );
                node.addEventListener('click', function () {
                    if (solved) return;
                    if (word.w === target.w) {
                        solved = true;
                        node.classList.add('correct');
                        playSuccessTone();
                        addStar();
                        toast(praise());
                        speech.say(target.w, 0.75);
                        setTimeout(nextQuestion, 1500);
                    } else {
                        node.classList.add('dim');
                        node.disabled = true;
                    }
                });
                grid.appendChild(node);
            });

            footer.textContent = '';
            footer.appendChild(el('button', { class: 'ghost-btn press', text: 'מילה אחרת ←',
                                              onclick: nextQuestion }));
        }

        nextQuestion();

        return el('div', null,
            el('div', { class: 'hint-box blue' },
                el('div', { class: 't', text: 'קרא את המילה ובחר את התמונה' }),
                el('div', { class: 'd', text: 'נסה לקרוא לבד, בלי לשמוע. פרק את המילה לצלילים בראש.' })
            ),
            wordSlot, grid, footer
        );
    }

    /* =========================================================================
       שלב 3 — אוצר מילים בתמונות
       ========================================================================= */
    function buildVocabCategory(categoryId) {
        var category = VOCAB.filter(function (c) { return c.id === categoryId; })[0];
        var grid = el('div', { class: 'vocab-grid' });

        category.items.forEach(function (item) {
            var card = el('button', {
                    class: 'vocab-card press' + (hasSeen('vocab:' + item.w) ? ' learned' : ''),
                    'aria-label': item.w
                },
                el('span', { class: 'emo', text: item.emoji }),
                el('span', { class: 'w en', text: item.w }),
                el('span', { class: 'he', text: item.he }),
                el('span', { class: 'spk', text: '🔊' })
            );
            card.addEventListener('click', function () {
                markSeen('vocab:' + item.w);
                card.classList.add('learned');
                speech.say(item.w, 0.8, card);
            });
            grid.appendChild(card);
        });

        return el('div', null,
            el('p', { class: 'instruct', text: 'לחץ על כרטיסייה כדי לשמוע את המילה 👇' }),
            grid
        );
    }

    /* =========================================================================
       שלב 4 — קריאת משפטים
       ========================================================================= */
    function buildSentenceReader() {
        var box = el('div', { class: 'sentence-box' });
        var counter = el('p', { class: 'instruct' });
        var playBtn = el('button', { class: 'play-all press' },
            el('span', { text: '🔊' }),
            el('span', { text: 'נגן את כל המשפט' })
        );
        var heBox = el('div', { class: 'he-reveal' });
        var toggle = el('button', { class: 'translate-toggle press' });
        var index = 0;

        playBtn.addEventListener('click', function () {
            // המשפט השלם נקרא לאט — rate 0.8
            speech.say(SENTENCES[index].words.join(' '), 0.8, playBtn);
        });

        toggle.addEventListener('click', function () {
            heBox.hidden = !heBox.hidden;
            toggle.textContent = heBox.hidden ? '👁️ הצג תרגום' : '🙈 הסתר תרגום';
        });

        function draw() {
            var sentence = SENTENCES[index];
            markSeen('sentence:' + index);
            counter.textContent = 'משפט ' + (index + 1) + ' מתוך ' + SENTENCES.length +
                                  ' — לחץ על כל מילה כדי לשמוע אותה לבד';
            box.textContent = '';
            var row = el('div', { class: 'sentence' });
            sentence.words.forEach(function (word) {
                var btn = el('button', { class: 'sentence-word press en', text: word });
                btn.addEventListener('click', function () { speech.say(word, 0.75, btn); });
                row.appendChild(btn);
            });
            box.appendChild(row);
            heBox.textContent = sentence.he;
            heBox.hidden = true;
            toggle.textContent = '👁️ הצג תרגום';
        }

        function move(step) {
            index = (index + step + SENTENCES.length) % SENTENCES.length;
            draw();
        }

        draw();

        return el('div', null,
            counter, box, playBtn, toggle, heBox,
            el('div', { class: 'nav-row' },
                el('button', { class: 'nav-btn press', text: '→ הקודם', onclick: function () { move(-1); } }),
                el('button', { class: 'nav-btn press', text: 'הבא ←',  onclick: function () { move(1); } })
            )
        );
    }

    /* סידור משפט: מקבלים רק את המילה הנכונה בתור — בלי עונש על טעות */
    function buildSentenceOrder() {
        var slots = el('div', { class: 'slot-row' });
        var chipRow = el('div', { class: 'chip-row' });
        var footer = el('div', { class: 'center', style: 'margin-top:24px' });
        var sentence, position;

        function newRound() {
            sentence = SENTENCES[Math.floor(Math.random() * SENTENCES.length)];
            position = 0;
            slots.textContent = '';
            slots.classList.remove('done');
            chipRow.textContent = '';

            shuffle(sentence.words.map(function (w, i) { return { w: w, i: i }; })).forEach(function (entry) {
                var chip = el('button', { class: 'chip press en', text: entry.w });
                chip.addEventListener('click', function () {
                    if (chip.classList.contains('used')) return;
                    if (entry.w === sentence.words[position]) {
                        chip.classList.add('used');
                        chip.disabled = true;
                        slots.appendChild(el('span', { class: 'chip placed en', text: entry.w }));
                        speech.say(entry.w, 0.75);
                        position++;
                        if (position === sentence.words.length) {
                            slots.classList.add('done');
                            playSuccessTone();
                            addStar();
                            toast(praise());
                            setTimeout(function () {
                                speech.say(sentence.words.join(' '), 0.8);
                            }, 400);
                            setTimeout(newRound, 2600);
                        }
                    } else {
                        chip.classList.add('wrong');
                        setTimeout(function () { chip.classList.remove('wrong'); }, 450);
                    }
                });
                chipRow.appendChild(chip);
            });

            footer.textContent = '';
            footer.appendChild(el('button', { class: 'ghost-btn press', text: '🔄 משפט אחר', onclick: newRound }));
        }

        newRound();

        return el('div', null,
            el('div', { class: 'hint-box violet' },
                el('div', { class: 't', text: 'סדר את המשפט' }),
                el('div', { class: 'd', text: 'לחץ על המילים לפי הסדר הנכון, משמאל לימין.' })
            ),
            slots, chipRow, footer
        );
    }

    /* =========================================================================
       שלב 5 — משחקים ותרגול
       ========================================================================= */

    /* שומעים מילה, בוחרים את התמונה */
    function buildPictureQuiz() {
        var pool = allPictureWords();
        var grid = el('div', { class: 'pic-grid' });
        var footer = el('div', { class: 'center', style: 'margin-top:24px' });
        var listenBtn = el('button', { class: 'listen-btn press' },
            el('span', { text: '🔊' }),
            el('span', { text: 'שמע שוב' })
        );
        var target, solved, promptTimer;

        listenBtn.addEventListener('click', function () {
            speech.say(target.w, 0.75, listenBtn);
        });

        function nextQuestion() {
            var options = sample(pool, 4);
            target = options[Math.floor(Math.random() * options.length)];
            solved = false;
            grid.textContent = '';

            options.forEach(function (item) {
                var node = el('button', { class: 'pic-option press' },
                    el('span', { class: 'emo', text: item.emoji }),
                    el('span', { class: 'he', text: item.he })
                );
                node.addEventListener('click', function () {
                    if (solved) return;
                    if (item.w === target.w) {
                        solved = true;
                        node.classList.add('correct');
                        playSuccessTone();
                        addStar();
                        toast(praise());
                        setTimeout(nextQuestion, 1500);
                    } else {
                        node.classList.add('dim');
                        node.disabled = true;
                    }
                });
                grid.appendChild(node);
            });

            footer.textContent = '';
            footer.appendChild(el('button', { class: 'ghost-btn press', text: 'שאלה אחרת ←',
                                              onclick: nextQuestion }));

            if (promptTimer) clearTimeout(promptTimer);
            promptTimer = setTimeout(function () { speech.say(target.w, 0.75, listenBtn); }, 350);
        }

        nextQuestion();

        return el('div', null,
            el('div', { class: 'hint-box violet' },
                el('div', { class: 't', text: 'איזו תמונה שמעת?' }),
                el('div', { class: 'd', text: 'הקשב למילה ולחץ על התמונה המתאימה.' })
            ),
            el('div', { class: 'center', style: 'margin-bottom:8px' }, listenBtn),
            grid, footer
        );
    }

    /* אות חסרה: C _ T */
    function buildMissingLetter() {
        var hint = el('div', { class: 'word-hint' });
        var row = el('div', { class: 'missing-row' });
        var options = el('div', { class: 'options-grid' });
        var footer = el('div', { class: 'center', style: 'margin-top:24px' });
        var word, hiddenIndex, solved, blankSlot;

        function newRound() {
            word = CVC_WORDS[Math.floor(Math.random() * CVC_WORDS.length)];
            hiddenIndex = Math.floor(Math.random() * word.w.length);
            solved = false;

            hint.textContent = word.emoji + '  ' + word.he;
            row.textContent = '';
            word.w.split('').forEach(function (ch, i) {
                if (i === hiddenIndex) {
                    blankSlot = el('div', { class: 'slot blank en', text: '?' });
                    row.appendChild(blankSlot);
                } else {
                    row.appendChild(el('div', { class: 'slot en', text: ch }));
                }
            });

            // האות הנכונה בתוך שלוש מסיחות
            var correct = word.w[hiddenIndex];
            var others = shuffle(ALPHABET.filter(function (l) {
                return l.lower !== correct;
            })).slice(0, 3).map(function (l) { return l.lower; });
            var choices = shuffle(others.concat([correct]));

            options.textContent = '';
            choices.forEach(function (ch) {
                var node = el('button', { class: 'option-cell press en', text: ch });
                node.addEventListener('click', function () {
                    if (solved) return;
                    if (ch === correct) {
                        solved = true;
                        blankSlot.textContent = ch;
                        blankSlot.classList.remove('blank');
                        blankSlot.classList.add('filled');
                        node.classList.add('correct');
                        playSuccessTone();
                        addStar();
                        toast(praise());
                        speech.say(word.w, 0.75);
                        setTimeout(newRound, 1800);
                    } else {
                        node.classList.add('dim');
                        node.disabled = true;
                    }
                });
                options.appendChild(node);
            });

            footer.textContent = '';
            footer.appendChild(el('button', { class: 'ghost-btn press', text: 'מילה אחרת ←', onclick: newRound }));
        }

        newRound();

        return el('div', null,
            el('div', { class: 'hint-box blue' },
                el('div', { class: 't', text: 'איזו אות חסרה?' }),
                el('div', { class: 'd', text: 'התמונה והתרגום עוזרים לך לנחש איזו מילה זאת.' })
            ),
            hint, row,
            el('p', { class: 'instruct', text: 'בחר את האות החסרה:' }),
            options, footer
        );
    }

    /* =========================================================================
       מסכי השלבים — הגדרה אחת לכל חמשת השלבים
       ========================================================================= */
    var STAGE_TABS = {
        1: [
            { id: 'letters', label: 'האותיות',    emoji: '🔤', build: buildAlphabetGrid },
            { id: 'match',   label: 'משחק התאמה', emoji: '🧩', build: buildMatchGame },
            { id: 'listen',  label: 'שמע ובחר',   emoji: '👂', build: buildListenGame }
        ],
        2: [
            { id: 'break', label: 'פירוק מילים', emoji: '🔠', build: buildWordGrid },
            { id: 'pick',  label: 'קרא ובחר',   emoji: '🔍', build: buildReadAndPick }
        ],
        3: VOCAB.map(function (category) {
            return {
                id: category.id, label: category.label, emoji: category.emoji,
                build: function () { return buildVocabCategory(category.id); }
            };
        }),
        4: [
            { id: 'read',  label: 'קריאת משפטים', emoji: '📖', build: buildSentenceReader },
            { id: 'order', label: 'סדר את המשפט', emoji: '🧱', build: buildSentenceOrder }
        ],
        5: [
            { id: 'quiz',    label: 'חידון תמונות', emoji: '🖼️', build: buildPictureQuiz },
            { id: 'missing', label: 'אות חסרה',     emoji: '🧩', build: buildMissingLetter }
        ]
    };

    function buildStage(stageId) {
        var stage = STAGES.filter(function (x) { return x.id === stageId; })[0];
        var tabs = STAGE_TABS[stageId];
        var activeId = state.tabs[stageId];
        var active = tabs.filter(function (t) { return t.id === activeId; })[0] || tabs[0];

        var screen = el('div', { class: 'wrap', style: 'padding-bottom:48px' },
            el('div', { class: 'stage-head' },
                el('h2', { text: stage.emoji + ' שלב ' + stage.id + ': ' + stage.title }),
                el('p', { text: stage.desc })
            )
        );

        // שלב עם לשונית אחת לא צריך שורת לשוניות
        if (tabs.length > 1) {
            var row = el('div', { class: 'tabs' });
            tabs.forEach(function (tab) {
                row.appendChild(el('button', {
                        class: 'tab-btn press' + (tab.id === active.id ? ' active' : ''),
                        onclick: function () { state.tabs[stageId] = tab.id; render(); }
                    },
                    el('span', { text: tab.emoji }),
                    el('span', { text: tab.label })
                ));
            });
            screen.appendChild(row);
        }

        screen.appendChild(active.build());
        return screen;
    }

    /* =========================================================================
       ציור המסך
       ========================================================================= */
    function render() {
        closeSheet();
        var app = document.getElementById('app');
        app.textContent = '';

        if (state.screen !== 'home') app.appendChild(buildHeader());

        if (!speech.supported) {
            app.appendChild(el('div', { class: 'banner',
                text: '🔇 הדפדפן הזה לא תומך בהשמעת קול. אפשר להמשיך ללמוד, אבל כדאי לעבור לכרום או לספארי.' }));
        }

        if (state.screen === 'home') {
            app.appendChild(buildHome());
            return;
        }

        app.appendChild(buildStageNav());

        app.appendChild(buildStage(state.screen));
    }

    speech.init();
    load();
    render();
})();
</script>
</body>
